    sec("내 친구 코드");
    const code=el("div",{cls:"soc-code"},fmtCode(p.pid));
    body.appendChild(el("div",{cls:"soc-row"},code,btn("복사",()=>{try{navigator.clipboard.writeText(fmtCode(p.pid)).then(()=>toast("친구 코드를 복사했어요."),()=>toast(fmtCode(p.pid)))}catch(e){toast(fmtCode(p.pid))}})));
    sec("코드로 친구 신청");
    const inp=el("input",{cls:"t soc-in",id:"soc-code-in",placeholder:"abcd-efgh-ijkl",maxlength:"16",autocomplete:"off"});
    body.appendChild(el("div",{cls:"soc-row"},inp,btn("신청",()=>friendRequest(inp.value))));
    sec(`친구 ${p.friends.length}명`);
    if(!p.friends.length)body.appendChild(el("p",{cls:"soc-empty"},"아직 친구가 없어요. 접속 중인 트레이너에게 신청해 보세요."));
    for(const f of p.friends){const o=S.others.get(f.pid);
      let where="오프라인";if(o){const dx=o.x/TS-S.me.x/TS,dy=o.y/TS-S.me.y/TS,d=Math.round(Math.hypot(dx,dy));where=d<3?"바로 옆":`${dirWord(dx,dy)}쪽 ${d}칸`}
      body.appendChild(el("div",{cls:"soc-item"},el("i",{cls:o?"dot":"dot off"}),el("span",{cls:"nm"},o?o.nick:f.nick),el("small",{},where),btn("삭제",()=>removeFriend(f.pid),"sb ghost")))}
    sec("지금 접속 중인 트레이너");
    if(NET.mode!=="online")body.appendChild(el("p",{cls:"soc-empty"},"ESC → 서버 연결을 누르면 다른 트레이너가 보여요."));
    else if(!S.others.size)body.appendChild(el("p",{cls:"soc-empty"},"지금은 나 혼자예요."));
    for(const [pid,o] of S.others){
      const row=el("div",{cls:"soc-item"},el("i",{cls:"dot"}),el("span",{cls:"nm"},o.nick));
      if(isFriend(pid))row.append(el("small",{},"친구"));
      else if(p.freqOut.includes(pid))row.append(el("small",{},"신청함"));
      else if(/^[a-z0-9]{12}$/.test(pid))row.append(btn("친구 신청",()=>friendRequest(pid)));
      if(amLeader()&&!G().members[pid]&&/^[a-z0-9]{12}$/.test(pid))row.append(btn("길드 초대",()=>inviteGuild(pid)));
      body.appendChild(row);
    }
  } else if(SOC.tab==="requests"){
    sec("받은 친구 신청");
    if(!p.freqIn.length)body.appendChild(el("p",{cls:"soc-empty"},"받은 친구 신청이 없어요."));
    for(const r of p.freqIn)body.appendChild(el("div",{cls:"soc-item"},el("span",{cls:"nm"},r.nick),el("small",{},S.others.has(r.pid)?"접속 중":"오프라인"),btn("수락",()=>acceptFriend(r.pid)),btn("거절",()=>declineFriend(r.pid),"sb ghost")));
    sec("받은 길드 초대");
    if(!p.ginv.length)body.appendChild(el("p",{cls:"soc-empty"},"받은 길드 초대가 없어요."));
    for(const r of p.ginv)body.appendChild(el("div",{cls:"soc-item"},el("span",{cls:"nm"},`「${r.name}」`),el("small",{},`${r.from}님 초대`),btn("가입",()=>acceptGuild(r.gid)),btn("거절",()=>{p.ginv=p.ginv.filter(x=>x.gid!==r.gid);saveProfile();renderSocial()},"sb ghost")));
    if(p.freqOut.length){sec("보낸 친구 신청");body.appendChild(el("p",{cls:"soc-empty"},`${p.freqOut.length}명에게 보냈어요. 상대가 수락하면 친구가 돼요.`))}
  } else {
    const g=G();
    if(!g){
      sec("길드 만들기");
      const inp=el("input",{cls:"t soc-in",id:"soc-gname",placeholder:"길드 이름 (2~12자)",maxlength:"12",autocomplete:"off"});
      body.appendChild(el("div",{cls:"soc-row"},inp,btn("만들기",()=>createGuild(inp.value))));
      body.appendChild(el("p",{cls:"soc-empty"},"길드를 만들면 길드장이 돼요. 친구 탭의 접속 중 목록에서 길드원을 초대할 수 있어요. 받은 초대는 신청 탭에 있어요."));
    } else {
      const lead=g.members[g.leader]||"길드장";
      body.appendChild(el("div",{cls:"soc-gname"},`「${g.name}」`));
      body.appendChild(el("p",{cls:"soc-empty"},`길드장 ${lead} · 길드원 ${Object.keys(g.members).length}명`));
      sec("길드원");
      for(const [pid,nick] of Object.entries(g.members)){const on=pid===p.pid||S.others.has(pid);
        body.appendChild(el("div",{cls:"soc-item"},el("i",{cls:on?"dot":"dot off"}),el("span",{cls:"nm"},nick+(pid===p.pid?" (나)":"")),el("small",{},pid===g.leader?"길드장":on?"접속 중":"오프라인")))}
      sec("길드 채팅");
      const log=el("div",{cls:"soc-chat",id:"soc-chat"});
      if(!SOC.chat.length)log.append(el("p",{cls:"soc-empty"},"접속 중인 길드원과 대화할 수 있어요."));
      for(const c of SOC.chat)log.append(el("div",{cls:c.me?"me":""},el("b",{},c.nick+": "),c.text));
      body.appendChild(log);
      const inp=el("input",{cls:"t soc-in",id:"soc-chat-in",placeholder:"메시지 입력 후 엔터",maxlength:"120",autocomplete:"off"});
      const sendIt=()=>{guildChat(inp.value);inp.value=""};
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();sendIt()}});
      body.appendChild(el("div",{cls:"soc-row"},inp,btn("보내기",sendIt)));
      body.appendChild(btn(amLeader()?"길드 해체":"길드 나가기",()=>{if(SOC.confirmLeave){SOC.confirmLeave=false;leaveGuild()}else{SOC.confirmLeave=true;toast("한 번 더 누르면 "+(amLeader()?"해체돼요.":"나가요."));setTimeout(()=>SOC.confirmLeave=false,3000)}},"sb ghost wide"));
      log.scrollTop=log.scrollHeight;
    }
  }
}
for(const t of ["friends","requests","guild"])$("soc-tab-"+t).onclick=()=>{SOC.tab=t;renderSocial()};
$("soc-btn").onclick=()=>toggleSocial();
$("soc-close").onclick=()=>toggleSocial(false);
setInterval(()=>{if(!SOC.open)return;placeSocial();if(SOC.tab==="friends"&&document.activeElement?.id!=="soc-code-in")renderSocial()},3000);

/* =====================================================================
   RENDER
   ===================================================================== */
const ctx=cvs.getContext("2d");
let VW=0,VH=0,DPR=1,Z=2;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cvs.width=Math.round(VW*DPR);cvs.height=Math.round(VH*DPR);Z=VW<560?1.5:VW<1100?2:2.4}
addEventListener("resize",resize);resize();

/* local minimap: tiles around the player */
const MINI_COL={};
function miniColor(tx,ty){const t=tileAt(tx,ty),b=biomeAt(tx,ty),P=PAL[b]||PAL.meadow;
  switch(t){case T.WATER:return"#3f8fd6";case T.LAVA:return"#c8401e";case T.TREE:return P.tree[0];case T.ROCK:return"#6d6a66";case T.CRYSTAL:return"#8a6be0";
    case T.PATH:case T.BRIDGE:return"#e3c48c";case T.PLAZA:case T.FOUNTAIN:case T.PEDESTAL:case T.GYMFLOOR:return"#d8d2c4";case T.HOUSE:return"#c4523f";case T.GYM:{const g=gymZone(tx,ty);return g?g.color:"#ccc"}
    case T.TALL:return P.tall;case T.SAND:return P.sand;case T.HEAL:return"#e8608a";case T.SHOP:return"#3f7fd6";default:return P.g}}
let miniAt=0;
function drawMinimap(){
  if(S.t-miniAt<0.25)return;miniAt=S.t;
  const c=$("mini").getContext("2d"),W=80,H=60,ptx=Math.floor(S.me.x/TS),pty=Math.floor(S.me.y/TS);
  const img=c.createImageData(W,H);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const col=miniColor(ptx-W/2+i,pty-H/2+j),o=(j*W+i)*4;
    img.data[o]=parseInt(col.slice(1,3),16);img.data[o+1]=parseInt(col.slice(3,5),16);img.data[o+2]=parseInt(col.slice(5,7),16);img.data[o+3]=255}
  const tmp=drawMinimap.tmp||(drawMinimap.tmp=Object.assign(document.createElement("canvas"),{width:W,height:H}));
  tmp.getContext("2d").putImageData(img,0,0);
  c.imageSmoothingEnabled=false;c.clearRect(0,0,160,120);c.drawImage(tmp,0,0,160,120);
  const px=(x)=>(x/TS-ptx+W/2)*2,py=(y)=>(y/TS-pty+H/2)*2;
  for(const w of wildNear(S.me.x,S.me.y,2)){c.fillStyle="#ff6b6b";c.fillRect(px(w.x)-1.5,py(w.y)-1.5,3,3)}
  for(const o of S.others.values()){c.fillStyle=o.color;c.fillRect(px(o.x)-2,py(o.y)-2,4,4)}
  const boss=currentBoss();
  if(boss){const dx=boss.x/TS-ptx,dy=boss.y/TS-pty;
    if(Math.abs(dx)>W/2-2||Math.abs(dy)>H/2-2){const a=Math.atan2(dy,dx);c.save();c.translate(80+Math.cos(a)*56,60+Math.sin(a)*46);c.rotate(a);c.fillStyle="#ff4a2c";c.strokeStyle="#fff";c.lineWidth=1.5;c.beginPath();c.moveTo(8,0);c.lineTo(-6,-6);c.lineTo(-6,6);c.closePath();c.fill();c.stroke();c.restore()}
    else{c.fillStyle="#ff4a2c";c.beginPath();c.arc(px(boss.x),py(boss.y),4,0,7);c.fill()}}
  // arrow to the next gym when it's off the minimap
  const g=GYMS.find(x=>!S.profile.badges.includes(x.id));
  if(g){const dx=g.tx-ptx,dy=g.ty-pty;if(Math.abs(dx)>W/2-2||Math.abs(dy)>H/2-2){const a=Math.atan2(dy,dx),r=52;c.save();c.translate(80+Math.cos(a)*r,60+Math.sin(a)*Math.min(r,50));c.rotate(a);
    c.fillStyle=g.color;c.strokeStyle="#fff";c.lineWidth=1.5;c.beginPath();c.moveTo(7,0);c.lineTo(-5,-5);c.lineTo(-5,5);c.closePath();c.fill();c.stroke();c.restore()}
    else{c.fillStyle=g.color;c.fillRect(px((g.tx+0.5)*TS)-3,py(g.ty*TS)-3,6,6)}}
  c.fillStyle="#fff";c.fillRect(77,57,6,6);c.fillStyle=S.profile.color;c.fillRect(78,58,4,4);
}
function label(c,text,x,y,col="#fff",bg="rgba(10,18,22,.72)"){
  const fs=12/Z*1.15;c.font=`${fs}px Jua, sans-serif`;const w=c.measureText(text).width+fs;
  c.fillStyle=bg;c.beginPath();c.roundRect(x-w/2,y-fs-fs*0.35,w,fs*1.5,fs*0.4);c.fill();
  c.fillStyle=col;c.textAlign="center";c.textBaseline="middle";c.fillText(text,x,y-fs*0.38);
}
function render(){
  if(S.battle){renderBattle();return}
  if(S.mapOpen)renderMap();
  chunkClock++;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="#121c22";ctx.fillRect(0,0,VW,VH);
  const vw=VW/Z,vh=VH/Z;
  let cx,cy;
  if(S.phase==="game"){cx=S.me.x-vw/2;cy=S.me.y-vh/2-8}
  else{cx=SPAWN.x-vw/2+Math.sin(S.t*0.15)*120;cy=SPAWN.y-vh/2-90}
  cx=Math.round(cx*Z)/Z;cy=Math.round(cy*Z)/Z;
  ctx.setTransform(DPR*Z,0,0,DPR*Z,-cx*DPR*Z,-cy*DPR*Z);
  ctx.imageSmoothingEnabled=false;
  // ground chunks in view (paint at most a few new ones per frame)
  const CW=CH*TS;let paints=0;
  for(let j=Math.floor(cy/CW);j<=Math.floor((cy+vh)/CW);j++)for(let i=Math.floor(cx/CW);i<=Math.floor((cx+vw)/CW);i++){
    const c=getChunk(i,j);
    if(!c.canvas){if(paints>=3&&S.phase==="game"){ctx.fillStyle=PAL[biomeAt(i*CH,j*CH)].g;ctx.fillRect(i*CW,j*CW,CW,CW);continue}paintChunk(c);paints++}
    ctx.drawImage(c.canvas,i*CW,j*CW,CW+0.5,CW+0.5);
  }
  const t=S.t;
  // fountain spray
  {const fx=FOUNTAIN.x,fy=FOUNTAIN.y;for(let i=0;i<6;i++){const a=(t*1.4+i/6)%1;ellipse(ctx,fx+Math.sin(i*2.1)*a*14,fy-14+a*a*30-a*18,1.6,1.6,`rgba(190,230,255,${1-a})`)}
   ellipse(ctx,fx,fy-6,3,8,"rgba(190,230,255,.75)")}
  const inView=(x,y)=>x>cx-60&&x<cx+vw+60&&y>cy-60&&y<cy+vh+80;
  const ents=[];
  if(inView(PROF.x,PROF.y))ents.push({y:PROF.y,draw:()=>{drawPerson(ctx,PROF.x,PROF.y,t,0,false,"#4a6b8a","#c9c9c9",true)},lab:()=>label(ctx,PROF_NAME,PROF.x,PROF.y-34,"#cfe3ff")});
  const starter=S.profile?.starter;
  for(const p of PEDESTALS){
    if(starter===p.kind&&S.phase==="game")continue;
    const px=p.tx*TS+16,py=p.ty*TS+16;
    if(inView(px,py))ents.push({y:py+10,draw:()=>{drawMon(ctx,p.kind,px,py,t+p.tx,0,false)}});
  }
  for(const g of GYMS){const x=(g.tx+0.5)*TS,y=g.ty*TS+20;if(inView(x,y))ents.push({y:y,draw:()=>drawPerson(ctx,x+96,y,t,0,false,g.color,"#2b2622"),lab:()=>label(ctx,`관장 ${g.leader}`,x+96,y-34,"#ffd24a")})}
  if(S.phase==="game")for(const w of wildNear(S.me.x,S.me.y,2)){
    if(!inView(w.x,w.y))continue;
    const sc=w.boss?1.6:1;
    ents.push({y:w.y,draw:()=>{if(w.boss){ctx.fillStyle=`rgba(255,80,60,${.25+Math.sin(t*4)*.1})`;ctx.beginPath();ctx.ellipse(w.x,w.y,26,10,0,0,7);ctx.fill()}drawMon(ctx,w.sp,w.x,w.y,t+w.x*0.01,w.dir,w.moving,sc,w.shiny)},
      lab:()=>label(ctx,`${w.boss?"👑 보스 ":""}${w.shiny?"✨":""}${w.special&&!w.boss?"★":""}Lv${w.lv} ${SPECIES[w.sp].name}`,w.x,w.y-(w.boss?42:26),w.boss?"#ffe08a":"#ffd9d9",w.boss?"rgba(90,20,10,.85)":"rgba(60,14,14,.72)")});
  }
  for(const o of S.others.values()){
    if(!inView(o.x,o.y))continue;
    if(o.starter)ents.push({y:o.cy,draw:()=>drawMon(ctx,o.starter,o.cx,o.cy,t,o.cdir,o.cmov,1,o.sh)});
    ents.push({y:o.y,draw:()=>{drawPerson(ctx,o.x,o.y,t,o.dir,o.moving,o.color)},lab:()=>label(ctx,o.nick,o.x,o.y-34)});
  }
  if(S.phase==="game"){
    const sp=activeSp();
    if(sp)ents.push({y:S.comp.y,draw:()=>drawMon(ctx,sp,S.comp.x,S.comp.y,t,S.comp.dir,S.comp.moving,1,activeMon().shiny)});
    ents.push({y:S.me.y,draw:()=>drawPerson(ctx,S.me.x,S.me.y,t,S.me.dir,S.me.moving,S.profile.color),lab:()=>label(ctx,S.profile.nickname,S.me.x,S.me.y-34,"#ffd24a")});
  }
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents)e.draw();
  for(const e of ents)e.lab&&e.lab();

  if(S.phase==="game"&&!S.dialog&&!S.modalOpen&&!S.mapOpen){
    if(!S.profile.starter&&!S.talked){const b=Math.sin(t*5)*2;label(ctx,"!",PROF.x,PROF.y-50+b,"#3a2a00","#ffd24a")}
    const n=nearest();
    if(n){
      let x,y,txt;
      if(n.type==="prof"){x=PROF.x;y=PROF.y-50;txt=S.profile.starter?"E  말 걸기 · 회복":"E  말 걸기"}
      else if(n.type==="fountain"){x=FOUNTAIN.x;y=FOUNTAIN.y-46;txt="E  몬스터 회복"}
      else if(n.type==="gym"){x=(n.gym.tx+0.5)*TS;y=n.gym.ty*TS-10;txt=`E  ${n.gym.name} 도전`}
      else if(n.type==="heal"){x=n.x;y=n.y-50;txt="E  치유센터 (회복)"}
      else if(n.type==="shop"){x=n.x;y=n.y-50;txt="E  상점"}
      else{const p=PEDESTALS.find(q=>q.kind===n.kind);x=p.tx*TS+16;y=p.ty*TS-16;txt=`E  ${SPECIES[n.kind].name} 살펴보기`}
      label(ctx,txt,x,y,"#3a2a00","#ffd24a");
    }
    const o=nearestPlayer();
    if(o)label(ctx,"F  배틀 신청",o.x,o.y-50,"#3a2a00","#ffd24a");
  }
  if(S.phase==="game")drawMinimap();
  if(artKind){drawPortrait($("mon-art"),artKind,"#22343e")}
}

/* =====================================================================
   LOOP
   ===================================================================== */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);render();
  if(S.phase==="auth"&&((S.t*10)|0)%2===0)document.querySelectorAll(".trio canvas").forEach(cv=>drawPortrait(cv,cv.dataset.mon));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.phase==="game"&&S.profile?.starter&&S.movedSinceSave){S.movedSinceSave=false;save({x:Math.round(S.me.x),y:Math.round(S.me.y)})}});
boot();
