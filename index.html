<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몬스터 테이밍 월드</title>
<meta name="theme-color" content="#121c22">
<script>if(/^https?:$/.test(location.protocol)){for(const [r,h] of [["manifest","manifest.webmanifest"],["icon","icon-192.png"],["apple-touch-icon","icon-192.png"]]){const l=document.createElement("link");l.rel=r;l.href=h;document.head.appendChild(l)}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-screen canvas world, HUD panels pinned to corners, modal cards over a dimmed map. Single dark "evening field" UI on purpose. */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#121c22; --panel:#18262e; --panel-2:#22343e; --line:#35505d;
  --text:#eef4f1; --muted:#9db3ad; --sun:#ffd24a; --sun-ink:#3a2a00;
  --water:#4aa8ff; --fire:#ff7a3d; --grass:#5cc65a; --danger:#ff6b6b;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}
button{font-family:var(--display);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn{border:0;border-radius:6px;padding:12px 18px;font-size:17px;background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 #b88f10;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88f10}
.btn.ghost{background:var(--panel-2);color:var(--text);box-shadow:0 4px 0 #0d161b}
.btn.black{background:#05090b;color:var(--text);border:1px solid #2a3a42;box-shadow:0 4px 0 #000}
.btn.black:active{box-shadow:0 1px 0 #000}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(120% 80% at 50% 110%,#2b4a2c 0%,#16262b 55%,#0e171c 100%);z-index:30;overflow:auto}
.auth-card{width:min(420px,100%);padding:26px 22px 22px;display:grid;gap:16px}
.logo{font-family:var(--display);font-size:clamp(30px,8vw,40px);line-height:1.05;text-wrap:balance;color:var(--text)}
.logo em{font-style:normal;color:var(--sun)}
.trio{display:flex;gap:6px;justify-content:center}
.trio canvas{width:84px;height:84px}
.sub{color:var(--muted);line-height:1.55;font-size:14px}
label.f{display:grid;gap:6px;font-family:var(--display);font-size:15px}
input.t{font:inherit;font-size:17px;padding:12px;border-radius:6px;border:2px solid var(--line);background:var(--ink);color:var(--text)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--text)}
.linkbtn{background:none;border:0;color:var(--muted);font-family:var(--body);font-size:14px;text-decoration:underline;padding:4px;justify-self:center}
input.t[type="date"]{min-height:48px}
.err{color:var(--danger);font-size:14px;min-height:1.2em}
.acct{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;line-height:1.5}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;pointer-events:none}
/* party (top-left) */
#party{top:calc(12px + env(safe-area-inset-top,0px));left:12px;padding:8px;width:218px}
.party-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
#me-name{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#badges{font-size:12px;color:var(--sun);white-space:nowrap}
#party-list{list-style:none;margin:0;padding:0;display:grid;gap:4px}
#party-list button{pointer-events:auto;width:100%;display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;text-align:left;background:var(--ink);border:2px solid transparent;border-radius:6px;padding:3px 6px 3px 3px;color:var(--text);font-family:var(--body)}
#party-list button.on{border-color:var(--sun);background:#26353d}
#party-list button.down{opacity:.5}
#party-list canvas{width:34px;height:34px}
.pm-top{display:flex;justify-content:space-between;gap:6px;font-size:13px;line-height:1.1}
.pm-top b{font-family:var(--display);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-top span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar2{height:5px;background:#0b1216;border-radius:3px;overflow:hidden;margin-top:3px}
.bar2 i{display:block;height:100%;background:var(--grass)}
.bar2.xp{height:3px;margin-top:2px}.bar2.xp i{background:#6fb7ff}
.party-hint{font-size:11px;color:var(--muted);padding:6px 4px 0;text-align:center}
.party-empty{font-size:13px;color:var(--muted);padding:2px 4px 4px}

/* friends & guild (right side) */
#soc-btn{pointer-events:auto;margin-top:8px;width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:13px;padding:5px 8px}
#social{position:fixed;right:12px;top:calc(160px + env(safe-area-inset-top,0px));width:310px;max-height:calc(100% - 330px);min-height:220px;z-index:12;display:flex;flex-direction:column;overflow:hidden}
.soc-head{display:flex;align-items:center;gap:8px;padding:8px 8px 0 8px}
.soc-tabs{display:flex;gap:4px;flex:1}
.soc-tabs button{flex:1;background:var(--ink);color:var(--muted);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:6px 4px;font-size:14px}
.soc-tabs button.on{background:var(--panel-2);color:var(--sun);border-bottom-color:var(--panel-2)}
#soc-close{background:none;border:0;color:var(--muted);font-size:16px;padding:4px 6px}
#soc-body{padding:4px 12px 12px;overflow:auto;display:grid;gap:6px;align-content:start;background:var(--panel)}
#soc-body h4{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:14px;color:var(--sun)}
.soc-row{display:flex;gap:6px;align-items:center}
.soc-in{flex:1;min-width:0;font-size:14px!important;padding:8px!important}
.soc-code{flex:1;font-family:var(--display);font-size:18px;letter-spacing:.06em;background:var(--ink);border-radius:6px;padding:6px 10px;-webkit-user-select:all;user-select:all}
.soc-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel-2);border-radius:6px;font-size:14px}
.soc-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soc-item small{color:var(--muted);font-size:12px;white-space:nowrap}
.sb{background:var(--sun);color:var(--sun-ink);border:0;border-radius:5px;padding:5px 9px;font-size:13px;white-space:nowrap}
.sb.ghost{background:var(--ink);color:var(--muted);border:1px solid var(--line)}
.sb.wide{width:100%;margin-top:8px;padding:8px}
.soc-empty{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.soc-gname{font-family:var(--display);font-size:22px;margin-top:6px}
.soc-chat{background:var(--ink);border-radius:6px;padding:8px;height:150px;overflow:auto;font-size:13px;line-height:1.5;display:grid;align-content:start;gap:2px}
.soc-chat .me b{color:var(--sun)}.soc-chat b{font-weight:400;color:#9fd3ff}

/* battle */
#battle{position:fixed;inset:0;z-index:18;display:grid;grid-template-rows:1fr auto;background:#0e171c}
#bcv{width:100%;height:100%;display:block;min-height:0}
.bpanel{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--line);display:grid;gap:10px}
#blog{font-size:17px;line-height:1.5;min-height:1.6em;font-family:var(--display)}
#bmoves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
#bmoves button,#bopts button,#bswitch button{border-radius:6px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);padding:9px 8px;text-align:left;min-width:0}
#bmoves button b{display:block;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bmoves button small{font-family:var(--body);font-size:12px;color:var(--muted)}
#bmoves button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#bopts{display:flex;gap:8px;flex-wrap:wrap}
#bopts button{text-align:center;flex:1 1 90px;font-size:15px}
#bopts button.tame{background:#3a3010;border-color:#b88f10;color:var(--sun)}
#battle button:disabled{opacity:.4;cursor:default}
#bswitch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#bswitch button small{display:block;color:var(--muted);font-family:var(--body);font-size:12px}

/* learn a move */
#learn{position:fixed;inset:0;z-index:24;display:grid;place-items:center;padding:16px;background:rgba(6,12,16,.7)}
.learn-card{width:min(420px,100%);padding:18px;display:grid;gap:10px}
.learn-card h2{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.35}
.learn-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.learn-card .mv{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 12px;border-radius:6px;border:2px solid var(--line);background:var(--panel-2);color:var(--text);font-size:15px}
.learn-card .mv.new{border-color:var(--sun)}
.learn-card .mv small{font-family:var(--body);color:var(--muted);font-size:12px}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;color:#0d161b;margin-left:6px;vertical-align:1px}

/* world map */
#wmap{position:fixed;inset:0;z-index:19;background:rgba(6,12,16,.92);display:grid;grid-template-rows:auto 1fr auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));gap:8px}
#wmap header{display:flex;justify-content:space-between;align-items:center;gap:12px}
#wmap h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
#wmc{width:100%;height:100%;min-height:0;display:block;border-radius:8px;background:#0b1216;touch-action:none;cursor:grab}
.wm-legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.wm-legend span{display:flex;align-items:center;gap:5px}
.wm-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#online{top:calc(12px + env(safe-area-inset-top,0px));right:12px;padding:8px 12px;min-width:150px;max-width:200px}
#online h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:14px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grass);display:inline-block}
.dot.off{background:var(--muted)}
#online ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:2px;max-height:30vh;overflow:hidden}
#online li{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#online li i{width:8px;height:8px;border-radius:50%;flex:none}
#minimap{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:12px;padding:4px;line-height:0}
#minimap canvas{width:160px;height:120px;image-rendering:pixelated;border-radius:3px}
#quest{top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:8px 14px;max-width:min(440px,calc(100% - 24px));text-align:center;font-size:14px;line-height:1.4}
#quest b,#quest-title{font-family:var(--display);font-weight:400;color:var(--sun);display:block;font-size:12px;letter-spacing:.08em}
#keys{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
kbd{font-family:var(--display);background:var(--panel-2);border:1px solid var(--line);border-bottom-width:3px;border-radius:4px;padding:0 6px;color:var(--text)}

/* ---------- dialog ---------- */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 24px));padding:14px 18px 12px;z-index:15;cursor:pointer}
#dialog .who{font-family:var(--display);color:var(--sun);font-size:16px;margin-bottom:4px}
#dialog .say{font-size:17px;line-height:1.6;min-height:3.2em}
#dialog .next{text-align:right;font-size:12px;color:var(--muted)}

/* ---------- monster card ---------- */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(6,12,16,.6)}
.mon-card{width:min(440px,100%);padding:18px;display:grid;gap:12px;max-height:100%;overflow:auto}
.mon-head{display:flex;gap:14px;align-items:center}
.mon-head canvas{width:120px;height:120px;border-radius:6px;flex:none}
.mon-name{font-family:var(--display);font-size:30px;line-height:1}
.chip{display:inline-block;font-family:var(--display);font-size:13px;padding:3px 10px;border-radius:99px;color:#0d161b;margin-top:6px}
.mon-desc{line-height:1.65;font-size:15px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:13px}
.stats .bar{height:8px;background:var(--ink);border-radius:4px;overflow:hidden}
.stats .bar span{display:block;height:100%}
.stats .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.matchup{font-size:13px;color:var(--muted);background:var(--ink);border-radius:6px;padding:8px 10px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
.confirm-q{font-family:var(--display);font-size:19px;text-align:center;line-height:1.4}

/* ---------- ESC menu ---------- */
#menu{position:fixed;inset:0;z-index:22;display:grid;place-items:center;padding:16px;background:rgba(6,12,16,.6)}
.menu-card{width:min(380px,100%);padding:20px;display:grid;gap:14px}
.menu-card h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
#menu-status{margin:0;color:var(--muted);line-height:1.55;font-size:14px;min-height:3.1em}
.menu-card .sep{border-top:1px dashed var(--line)}
#menu-btn{pointer-events:auto;white-space:nowrap;flex:none;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:4px;font-size:12px;padding:3px 8px;margin-left:auto}
#online h3{justify-content:flex-start;white-space:nowrap}
#online li.hint{color:var(--sun);font-size:12px;margin-top:4px}
/* ---------- toast & touch ---------- */
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:25;padding:12px 18px;font-family:var(--display);font-size:17px;text-align:center;max-width:calc(100% - 32px);pointer-events:none;transition:opacity .25s}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(18,28,34,.35)}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.55)}
#act{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;pointer-events:auto;z-index:11}
#act button{width:68px;height:68px;font-size:13px!important;white-space:nowrap;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#act button.hot{background:var(--sun);color:var(--sun-ink);border-color:#b88f10}

@media (max-width:640px){
  #online{min-width:0;padding:6px 10px}
  #online ul{display:none}
  .party-head{flex-wrap:wrap;gap:0 6px}
  #quest{top:calc(112px + env(safe-area-inset-top,0px));left:auto;right:12px;transform:none;max-width:calc(100% - 186px);font-size:12px;text-align:left;padding:6px 10px}
  #keys{display:none}
  #social{left:12px;right:12px;width:auto;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:62%}
  #party{width:150px;padding:6px}
  #party-list canvas{width:26px;height:26px}
  #party-list button{grid-template-columns:26px 1fr}
  .party-hint{display:none}
  #bmoves{grid-template-columns:repeat(2,minmax(0,1fr))}
  #bswitch{grid-template-columns:repeat(2,minmax(0,1fr))}
  #blog{font-size:15px}
  #minimap canvas{width:112px;height:84px}
  .mon-head canvas{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}#toast{transition:none}}
</style>
</head>
<body>

<canvas id="game" aria-label="게임 화면"></canvas>

<!-- ===== 회원가입 / 로그인 ===== -->
<section id="auth">
  <div class="auth-card panel">
    <div class="trio" aria-hidden="true"><canvas data-mon="raki" width="168" height="168"></canvas><canvas data-mon="puhwa" width="168" height="168"></canvas><canvas data-mon="poi" width="168" height="168"></canvas></div>
    <div class="logo">몬스터 <em>테이밍</em> 월드</div>

    <div id="auth-loading" class="sub">불러오는 중이에요…</div>

    <form id="signup" hidden autocomplete="off">
      <div style="display:grid;gap:14px">
        <p class="sub" style="margin:0">처음 오셨네요. 이름과 비밀번호를 정하면 가입이 끝나요. 모든 트레이너는 같은 마을에서 시작해요.</p>
        <label class="f">트레이너 이름
          <input id="nick" class="t" maxlength="10" placeholder="2~10자, 한글·영문·숫자" required>
        </label>
        <label class="f">비밀번호
          <input id="pw" class="t" type="password" maxlength="20" autocomplete="new-password" placeholder="8~20자, 영문과 숫자 포함" required>
        </label>
        <label class="f">비밀번호 확인
          <input id="pw2" class="t" type="password" maxlength="20" autocomplete="new-password" placeholder="한 번 더 입력" required>
        </label>
        <label class="f">생년월일
          <input id="birth" class="t" type="date" min="1900-01-01" required>
        </label>
        <div class="f" style="display:grid;gap:6px;font-family:var(--display)">옷 색깔
          <div class="swatches" id="swatches" role="group" aria-label="옷 색깔"></div>
        </div>
        <div class="err" id="signup-err" role="alert"></div>
        <button class="btn" id="signup-btn" type="button">가입하고 시작하기</button>
      </div>
    </form>

    <form id="login" hidden autocomplete="off">
      <div style="display:grid;gap:14px">
        <p class="sub" style="margin:0">다시 오셨네요, <b id="login-nick" style="color:var(--text)"></b> 트레이너님.<br><span id="login-partner"></span></p>
        <label class="f">비밀번호
          <input id="login-pw" class="t" type="password" maxlength="20" autocomplete="current-password" required>
        </label>
        <div class="err" id="login-err" role="alert"></div>
        <button class="btn" id="login-btn" type="button">접속하기</button>
        <button class="linkbtn" id="forgot-btn" type="button">비밀번호를 잊으셨나요?</button>
      </div>
    </form>

    <!-- 비밀번호 재설정 / 기존 계정 보안 정보 추가 -->
    <form id="reset" hidden autocomplete="off">
      <div style="display:grid;gap:14px">
        <p class="sub" style="margin:0" id="reset-intro"></p>
        <label class="f" id="reset-birth-wrap">가입할 때 입력한 생년월일
          <input id="reset-birth" class="t" type="date" min="1900-01-01">
        </label>
        <label class="f">새 비밀번호
          <input id="reset-pw" class="t" type="password" maxlength="20" autocomplete="new-password" placeholder="8~20자, 영문과 숫자 포함" required>
        </label>
        <label class="f">새 비밀번호 확인
          <input id="reset-pw2" class="t" type="password" maxlength="20" autocomplete="new-password" required>
        </label>
        <div class="err" id="reset-err" role="alert"></div>
        <button class="btn" id="reset-btn" type="button">비밀번호 설정</button>

/* stat = ((2×base + 개체값) × Lv / 100) + 5 ;  특수 개체는 모든 능력치 +15% */
function monStats(m){
  const b=SPECIES[m.sp].base,iv=m.iv||{},L=m.lv,k=m.special?1.15:1,o={};
  for(const s of ["atk","def","spa","sdf","spe"])o[s]=Math.floor((Math.floor((2*b[s]+(iv[s]|0))*L/100)+5)*k);
  o.hp=Math.floor((Math.floor((2*b.hp+(iv.hp|0))*L/100)+L+10)*k);
  o.eva=Math.round(((iv.eva|0)/31*5+(m.special?4:0))*10)/10;  // % chance to dodge
  return o;
}
function ivTotal(m){let t=0;for(const k of STAT_KEYS)t+=(m.iv&&m.iv[k])|0;return t}
function ivGrade(m){const r=ivTotal(m)/(31*STAT_KEYS.length);return r>=.9?"S":r>=.75?"A":r>=.5?"B":r>=.3?"C":"D"}

}
/* rnd: () => [0,1). Rare "특수 개체" (1/300) has near-perfect values and +15% stats; 이로치 (1/256) has different colors. */
function rollIVs(rnd,forceSpecial){
  const special=forceSpecial||rnd()<1/300,iv={};
  for(const k of STAT_KEYS)iv[k]=special?28+Math.floor(rnd()*4):Math.floor(rnd()*32);
  return{iv,special};
}
function newMon(sp,lv,opt={}){
  lv=Math.max(1,Math.min(MAX_LV,lv|0));
  const rnd=opt.rnd||Math.random,{iv,special}=rollIVs(rnd,opt.special);
  const m={sp,lv,xp:0,moves:movesKnownAt(sp,lv),iv,special,shiny:opt.shiny!=null?opt.shiny:rnd()<1/256,uid:Math.random().toString(36).slice(2,9)};
  if(opt.extraMove&&!m.moves.includes(opt.extraMove)){if(m.moves.length>=4)m.moves[m.moves.length-1]=opt.extraMove;else m.moves.push(opt.extraMove)}
  m.hp=monStats(m).hp;return m;
}
const seededRnd=(seed)=>{let i=0;return()=>hash(i++,seed.length,[...seed].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))};

const TS=32, CH=16;
const T={GRASS:0,TALL:1,PATH:2,WATER:3,SAND:4,TREE:5,PLAZA:6,FLOWER:7,HOUSE:8,FOUNTAIN:9,PEDESTAL:10,BRIDGE:11,ROCK:12,LAVA:13,CRYSTAL:14,GYM:15,GYMFLOOR:16,MUSH:17,HEAL:19,SHOP:20};

function hash(x,y,s=0){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2246822519))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

const inTown=(x,y)=>x>=TOWN.x0&&x<=TOWN.x1&&y>=TOWN.y0&&y<=TOWN.y1;

/* ---- regions ---- */
const BIOMES=["meadow","grass","bug","fire","water","dragon","fighting"];
const townDist=(tx,ty)=>Math.hypot(tx-TOWN.cx,ty-TOWN.cy);
function gymZone(tx,ty){
  const j=(fbm(tx/14,ty/14,31)-0.5)*26;

  return null;
}
function biomeAt(tx,ty){
  const g=gymZone(tx,ty);if(g)return g.type;

  if(d<48)return "meadow";
  if(d<95)return fbm(tx/30,ty/30,61)>0.55?"grass":"meadow"; // gentle beginner area
  const jx=(fbm(tx/34,ty/34,41)-0.5)*90,jy=(fbm(tx/34,ty/34,43)-0.5)*90;

/* wild level grows with distance from town: gym Lv10 ≈ 60 tiles, Lv60 ≈ 435 tiles */
const levelAt=(tx,ty)=>Math.max(2,Math.min(MAX_LV,Math.round(2+townDist(tx,ty)/7.5)));

function terrain(tx,ty,b){
  const n=fbm(tx/9,ty/9,1),w=fbm(tx/11,ty/11,7),g=fbm(tx/6,ty/6,3),h=hash(tx,ty,9),h5=hash(tx,ty,5);
  switch(b){
    case"grass":   if(w<.27)return T.WATER;if(n>.72)return T.TREE;if(g>.5)return T.TALL;if(h<.08)return T.FLOWER;return T.GRASS;
    case"bug":     if(w<.26)return T.WATER;if(n>.55)return T.TREE;if(n>.47&&h5<.35)return T.TREE;if(h<.05)return T.MUSH;if(g>.48)return T.TALL;return T.GRASS;
    case"fire":    if(w<.32)return T.LAVA;if(n>.66)return T.ROCK;if(h5<.05)return T.ROCK;if(g>.62)return T.TALL;return T.GRASS;
    case"water":   if(w<.44)return T.WATER;if(n>.7)return T.TREE;if(g>.62)return T.TALL;if(h<.03)return T.FLOWER;return T.GRASS;
    case"dragon":  if(w<.25)return T.WATER;if(n>.6)return T.ROCK;if(h<.03)return T.CRYSTAL;if(g>.6)return T.TALL;return T.GRASS;
    case"fighting":if(w<.24)return T.WATER;if(n>.7)return T.ROCK;if(h5<.06)return T.ROCK;if(g>.6)return T.TALL;return T.GRASS;
    default:       if(w<.3)return T.WATER;if(n>.68)return T.TREE;if(n>.56&&h5<.3)return T.TREE;if(g>.58)return T.TALL;if(h<.035)return T.FLOWER;return T.GRASS;
  }
}
function gymTile(tx,ty){
  for(const g of GYMS){
    if(Math.abs(tx-g.tx)<=7&&ty>=g.ty-9&&ty<=g.ty+3){
      if(tx>=g.tx-3&&tx<=g.tx+3&&ty>=g.ty-5&&ty<=g.ty-1)return T.GYM;
      return T.GYMFLOOR;
    }
  }
  return -1;
}
function townTile(tx,ty){
  for(const p of PEDESTALS)if(p.tx===tx&&p.ty===ty)return T.PEDESTAL;
  if(tx>=39&&tx<=41&&ty>=30&&ty<=32)return T.FOUNTAIN;
  for(const h of HOUSES){
    if(tx>=h.x&&tx<h.x+h.w&&ty>=h.y&&ty<h.y+h.h)return T.HOUSE;
    if(tx===h.x+2&&(h.y<29?(ty>=h.y+h.h&&ty<29):(ty>=31&&ty<h.y)))return T.PATH;
  }
  if(tx>=PLAZA.x0&&tx<=PLAZA.x1&&ty>=PLAZA.y0&&ty<=PLAZA.y1)return T.PLAZA;

/* ---- rest stops: a healing center + a shop, along roads, by gyms and out in the wild ---- */
const nearGym=(x,y,r)=>GYMS.some(g=>Math.hypot(x-g.tx,y-g.ty)<r);
function makePlot(id,x0,y0,heal,shop){return{id,x0,y0,x1:x0+13,y1:y0+(heal.y-y0)+4+((id[0]==="h"||id[0]==="g")?4:4),heal,shop}}
function plotAt(tx,ty){
  // along the east-west road (north side)
  if(ty>=20&&ty<=28){const k=Math.round((tx-40)/50),cx=40+50*k;
    if(k!==0&&tx>=cx-7&&tx<=cx+6&&!nearGym(cx,24,32))return{id:"h"+k,x0:cx-7,y0:20,x1:cx+6,y1:28,heal:{x:cx-6,y:21},shop:{x:cx+1,y:21}}}
  // along the north-south road (east side)
  if(tx>=42&&tx<=55){const k=Math.round((ty-30)/50),cy=30+50*k;
    if(k!==0&&ty>=cy-5&&ty<=cy+3&&!nearGym(48,cy,32))return{id:"v"+k,x0:42,y0:cy-5,x1:55,y1:cy+3,heal:{x:43,y:cy-4},shop:{x:50,y:cy-4}}}
  // next to every gym
  for(const g of GYMS)if(tx>=g.tx-21&&tx<=g.tx-8&&ty>=g.ty-6&&ty<=g.ty+2)return{id:"g"+g.id,x0:g.tx-21,y0:g.ty-6,x1:g.tx-8,y1:g.ty+2,heal:{x:g.tx-20,y:g.ty-5},shop:{x:g.tx-14,y:g.ty-5}};
  // scattered across the open world
  const C=130,gx=Math.floor(tx/C),gy=Math.floor(ty/C);
  const ox=gx*C+30+Math.floor(hash(gx,gy,811)*70),oy=gy*C+30+Math.floor(hash(gx,gy,823)*70);
  if(tx>=ox-7&&tx<=ox+6&&ty>=oy-4&&ty<=oy+4&&townDist(ox,oy)>80&&!nearGym(ox,oy,45)&&Math.abs(oy-30)>14&&Math.abs(ox-40)>18)
    return{id:`w${gx}_${gy}`,x0:ox-7,y0:oy-4,x1:ox+6,y1:oy+4,heal:{x:ox-6,y:oy-3},shop:{x:ox+1,y:oy-3}};
  return null;
}
function plotTile(p,tx,ty){
  for(const [b,t] of [[p.heal,T.HEAL],[p.shop,T.SHOP]])if(tx>=b.x&&tx<b.x+5&&ty>=b.y&&ty<b.y+4)return t;
  return T.PLAZA;
}
const plotDoors=(p)=>[{kind:"heal",x:(p.heal.x+2.5)*TS,y:(p.heal.y+4)*TS+14},{kind:"shop",x:(p.shop.x+2.5)*TS,y:(p.shop.y+4)*TS+14}];
function baseTile(tx,ty){
  if(inTown(tx,ty))return townTile(tx,ty);
  const gt=gymTile(tx,ty);if(gt>=0)return gt;
  const pl=plotAt(tx,ty);if(pl)return plotTile(pl,tx,ty);

/* ---- chunk cache ---- */
const chunks=new Map();let chunkClock=0,chunkCanvases=0;
function getChunk(cx,cy){
  const key=cx+","+cy;let c=chunks.get(key);
  if(c){c.used=chunkClock;return c}
  const W=CH+2,base=new Uint8Array(W*W),x0=cx*CH-1,y0=cy*CH-1;
  for(let j=0;j<W;j++)for(let i=0;i<W;i++)base[j*W+i]=baseTile(x0+i,y0+j);
  const tiles=new Uint8Array(CH*CH);
  for(let j=0;j<CH;j++)for(let i=0;i<CH;i++){
    let t=base[(j+1)*W+i+1];
    if(t===T.GRASS||t===T.TALL||t===T.FLOWER||t===T.MUSH){ // shores
      let near=false;for(let b=0;b<3&&!near;b++)for(let a=0;a<3;a++){const u=base[(j+b)*W+i+a];if(u===T.WATER||u===T.LAVA){near=true;break}}
      if(near)t=T.SAND;
    }
    tiles[j*CH+i]=t;
  }
  c={cx,cy,tiles,canvas:null,used:chunkClock};chunks.set(key,c);
  if(chunks.size>2500){ // forget far chunks
    const list=[...chunks.values()].sort((a,b)=>a.used-b.used);
    for(const o of list.slice(0,800)){if(o.canvas)chunkCanvases--;chunks.delete(o.cx+","+o.cy)}
  }
  return c;
}
function tileAt(tx,ty){const cx=Math.floor(tx/CH),cy=Math.floor(ty/CH);return getChunk(cx,cy).tiles[(ty-cy*CH)*CH+(tx-cx*CH)]}
const at=tileAt;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function blocked(x,y){
  for(const [px,py] of [[x-8,y-4],[x+8,y-4],[x-8,y+3],[x+8,y+3]])
    if(SOLID.has(tileAt(Math.floor(px/TS),Math.floor(py/TS))))return true;
  return Math.hypot(x-PROF.x,y-PROF.y)<12;
}

/* ---- painting ---- */
const PAL={
  meadow:{g:"#79b85a",s:"#6aa64e",h:"#8cc96a",tall:"#5f9e45",bl:"#4b8636",tip:"#8fd06a",tree:["#2f7a3e","#3f9450","#58ad5f"],trunk:"#6b4a2e",sand:"#e5d095",sands:"#d4bd7f"},

function paintChunk(c){

      case T.LAVA:fill("#c8401e",x,y,TS,TS);fill("#e8661e",x+((r(2)*14)|0)+3,y+((r(3)*16)|0)+3,12,6);if(r(4)<.5)fill("#ffb13a",x+((r(5)*20)|0)+4,y+((r(6)*20)|0)+6,4,3);break;
      case T.BRIDGE:fill(t===T.BRIDGE&&biomeAt(tx,ty)==="fire"?"#c8401e":"#3f8fd6",x,y,TS,TS);fill("#a7774b",x,y+2,TS,TS-4);for(let k=0;k<4;k++)fill("#8a5f39",x+k*8,y+2,1,TS-4);fill("#6e4a2b",x,y+2,TS,2);fill("#6e4a2b",x,y+TS-4,TS,2);break;

  for(const p of PEDESTALS)if(inR(p.tx*TS,p.ty*TS))drawPedestal(g,p);
  for(const gy of GYMS)if(inR(gy.tx*TS,gy.ty*TS))drawGym(g,gy);
  const seen=new Set();
  for(let j=-8;j<=CH+8;j+=3)for(let i=-14;i<=CH+14;i+=3){const p=plotAt(ox+i,oy+j);if(p&&!seen.has(p.id)){seen.add(p.id);drawStop(g,p)}}
  g.restore();
  c.canvas=cv;chunkCanvases++;
  if(chunkCanvases>64){ // free far canvases
    const list=[...chunks.values()].filter(o=>o.canvas&&o!==c).sort((a,b)=>a.used-b.used);
    for(const o of list.slice(0,16)){o.canvas=null;chunkCanvases--}
  }
  return cv;
}

/* =====================================================================
   WILD MONSTERS — roam deterministically from (world seed, clock), so
   every player sees the same monster at the same place. A defeated or
   tamed monster disappears for everyone and respawns in a later cycle.
   ===================================================================== */
const WILD_CYCLE=150;     // seconds a spawn lives before a new one replaces it
const WILD_STEP=5;        // seconds per wander step
const wildGone=new Map(); // id -> until (ms)
function wildPick(pool,r){let tot=0;for(const [,w] of pool)tot+=w;let x=r*tot;for(const [sp,w] of pool){if((x-=w)<0)return sp}return pool[0][0]}
function wildWalkable(tx,ty){const t=tileAt(tx,ty);return !SOLID.has(t)&&t!==T.PATH&&t!==T.BRIDGE&&t!==T.GYMFLOOR&&!inTown(tx,ty)}
/* the spawns of one chunk at time `now` (seconds) */
function chunkWild(cx,cy,now){
  const out=[];
  const r0=hash(cx,cy,701);
  const count=r0<0.35?0:r0<0.8?1:2;
  for(let s=0;s<count;s++){
    const phase=hash(cx,cy,710+s)*WILD_CYCLE;
    const cyc=Math.floor((now+phase)/WILD_CYCLE);
    const id=`${cx}_${cy}_${s}_${cyc}`;
    // home tile: a few tries for open ground, preferring tall grass
    let hx=-1,hy=-1;
    for(let k=0;k<10;k++){
      const tx=cx*CH+Math.floor(hash(cyc,s*31+k,cx*7+cy*13+3)*CH),ty=cy*CH+Math.floor(hash(cyc,s*31+k,cx*11+cy*5+9)*CH);
      if(!wildWalkable(tx,ty))continue;
      hx=tx;hy=ty;if(tileAt(tx,ty)===T.TALL)break;
    }
    if(hx<0)continue;
    const biome=biomeAt(hx,hy);
    const zone=gymZone(hx,hy);
    const sp=wildPick(BIOME_POOLS[biome]||BIOME_POOLS.meadow,hash(cyc,s,cx*3+cy*17+41));
    let lv=zone?zone.lv-4+Math.floor(hash(cyc,s,cx+cy*29+77)*7):levelAt(hx,hy)-2+Math.floor(hash(cyc,s,cx+cy*29+77)*5);
    lv=Math.max(2,Math.min(MAX_LV,lv));
    // wander: move for 2.5s toward the next waypoint, then rest
    const step=Math.floor((now+phase)/WILD_STEP),f=((now+phase)/WILD_STEP)-step;
    const wp=(i)=>{const dx=Math.round((hash(i,s,cx*37+cy*91+cyc)-0.5)*6),dy=Math.round((hash(i,s,cx*53+cy*17+cyc+5)-0.5)*6);
      return wildWalkable(hx+dx,hy+dy)?[hx+dx,hy+dy]:[hx,hy]};
    const a=wp(step-1),b=wp(step),k=Math.min(1,f*2),e=k*k*(3-2*k);
    const x=(a[0]+(b[0]-a[0])*e+0.5)*TS,y=(a[1]+(b[1]-a[1])*e+0.6)*TS;
    const dx=b[0]-a[0],dy=b[1]-a[1];
    const dir=k<1&&(dx||dy)?(Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0)):0;
    const rr=seededRnd(id),sp_=rollIVs(rr).special,shiny=rr()<1/256; // same rolls the battle will use
    out.push({id,sp,lv,x,y,dir,moving:k<1&&(dx||dy)!==0,special:sp_,shiny});
  }
  return out;
}
/* wild monsters around a world position */
function wildNear(x,y,radiusChunks=2){
  const now=Date.now()/1000,ccx=Math.floor(x/TS/CH),ccy=Math.floor(y/TS/CH),list=[];
  for(let j=-radiusChunks;j<=radiusChunks;j++)for(let i=-radiusChunks;i<=radiusChunks;i++){
    for(const w of chunkWild(ccx+i,ccy+j,now)){const g=wildGone.get(w.id);if(g&&g>Date.now())continue;list.push(w)}
  }
  const boss=currentBoss(now);
  if(boss&&Math.abs(boss.x-x)<(radiusChunks+1)*CH*TS&&Math.abs(boss.y-y)<(radiusChunks+1)*CH*TS)list.push(boss);
  return list;
}
function markWildGone(id,ms=WILD_CYCLE*1000){wildGone.set(id,Date.now()+ms);if(wildGone.size>500)for(const [k,v] of wildGone)if(v<Date.now())wildGone.delete(k)}

/* ---- boss: every 30 minutes, for 15 minutes, at the same place for everyone ---- */
const BOSS_PERIOD=1800, BOSS_LIFE=900;
const bossCache=new Map();
function bossHome(k){
  if(bossCache.has(k))return bossCache.get(k);
  const a=hash(k,1,901)*Math.PI*2,d=70+hash(k,2,902)*330;
  let hx=Math.round(TOWN.cx+Math.cos(a)*d),hy=Math.round(TOWN.cy+Math.sin(a)*d),found=null;
  for(let r=0;r<14&&!found;r++)for(let j=-r;j<=r&&!found;j++)for(let i=-r;i<=r;i++){if(Math.max(Math.abs(i),Math.abs(j))!==r)continue;if(wildWalkable(hx+i,hy+j)){found=[hx+i,hy+j];break}}
  if(!found)found=[hx,hy];
  const biome=biomeAt(found[0],found[1]);
  const pool=BIOME_POOLS[biome]||BIOME_POOLS.meadow;
  const sp=pool[Math.floor(hash(k,4,904)*pool.length)][0];
  const lv=Math.max(8,Math.min(MAX_LV,levelAt(found[0],found[1])+8));
  const home={k,tx:found[0],ty:found[1],sp,lv,biome,shiny:hash(k,3,903)<0.35,id:"boss_"+k};
  bossCache.set(k,home);return home;
}
function currentBoss(nowSec=Date.now()/1000){
  const k=Math.floor(nowSec/BOSS_PERIOD),age=nowSec-k*BOSS_PERIOD;
  if(age>BOSS_LIFE)return null;
  const h=bossHome(k);
  const g=wildGone.get(h.id);if(g&&g>Date.now())return null;
  const step=Math.floor(nowSec/8),f=nowSec/8-step;
  const wp=(i)=>{const dx=Math.round((hash(i,k,931)-0.5)*4),dy=Math.round((hash(i,k,937)-0.5)*4);return wildWalkable(h.tx+dx,h.ty+dy)?[h.tx+dx,h.ty+dy]:[h.tx,h.ty]};
  const a=wp(step-1),b=wp(step),q=Math.min(1,f*1.6),e=q*q*(3-2*q);
  const dx=b[0]-a[0],dy=b[1]-a[1];
  return{id:h.id,boss:true,sp:h.sp,lv:h.lv,shiny:h.shiny,special:true,
    x:(a[0]+dx*e+0.5)*TS,y:(a[1]+dy*e+0.6)*TS,dir:q<1&&(dx||dy)?(Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0)):0,moving:q<1&&(dx||dy)!==0,
    endsAt:(k*BOSS_PERIOD+BOSS_LIFE)*1000,tx:h.tx,ty:h.ty};
}
const nextBossAt=()=>(Math.floor(Date.now()/1000/BOSS_PERIOD)+1)*BOSS_PERIOD*1000;
const mmss=(ms)=>{const s=Math.max(0,Math.round(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};

/* =====================================================================
   SPRITES (vector, drawn in world space)
   ===================================================================== */
function ellipse(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()}
function shadow(c,x,y,r){ellipse(c,x,y,r,r*0.38,"rgba(0,0,0,.22)")}
function eyes(c,x,y,gap,dir,r=1.7){
  if(dir===3)return; const ox=dir===1?-1.5:dir===2?1.5:0;
  ellipse(c,x-gap+ox,y,r,r*1.25,"#1b1b22");ellipse(c,x+gap+ox,y,r,r*1.25,"#1b1b22");
  ellipse(c,x-gap+ox+0.6,y-0.8,0.6,0.6,"#fff");ellipse(c,x+gap+ox+0.6,y-0.8,0.6,0.6,"#fff");
}
/* x,y = feet position. t = time (s) */
function drawStarter(c,kind,x,y,t,dir=0,moving=false){
  const hop=moving?Math.abs(Math.sin(t*12))*3:Math.sin(t*3)*0.8;
  shadow(c,x,y,9); const by=y-9-hop;
  if(kind==="raki"){
    // tail fin
    const sw=Math.sin(t*6)*2;
    c.fillStyle="#2f86d6";c.beginPath();c.moveTo(x+(dir===1?7:-7),by+2);c.lineTo(x+(dir===1?15:-15),by-4+sw);c.lineTo(x+(dir===1?14:-14),by+6+sw);c.closePath();c.fill();
    ellipse(c,x,by,10,8.5,"#5bb8f0");ellipse(c,x,by+3,6.5,4.5,"#c6ecff");
    // droplet crest
    c.fillStyle="#2f86d6";c.beginPath();c.moveTo(x,by-17);c.quadraticCurveTo(x+6,by-9,x,by-7);c.quadraticCurveTo(x-6,by-9,x,by-17);c.fill();
    ellipse(c,x-1.5,by-11,1.2,2,"#9fdcff");
    eyes(c,x,by-2,3.6,dir);
  } else if(kind==="puhwa"){
    const f=1+Math.sin(t*10)*0.15, tx=dir===1?x+9:x-9;
    // flame tail
    ellipse(c,tx,by-4,4.5*f,7*f,"#ff4d2e");ellipse(c,tx,by-3,3*f,4.5*f,"#ffd24a");
    ellipse(c,x,by,9.5,8.5,"#f07a3a");ellipse(c,x,by+3.5,5.5,4,"#ffd9b0");
    // ears
    c.fillStyle="#d85a22";for(const s of [-1,1]){c.beginPath();c.moveTo(x+s*3,by-6);c.lineTo(x+s*9,by-15);c.lineTo(x+s*9,by-4);c.closePath();c.fill()}
    c.fillStyle="#ffd24a";for(const s of [-1,1]){c.beginPath();c.moveTo(x+s*6,by-7);c.lineTo(x+s*8.5,by-12);c.lineTo(x+s*8.5,by-6);c.closePath();c.fill()}
    eyes(c,x,by-1.5,3.4,dir);
    if(dir!==3)ellipse(c,x+(dir===1?-1.5:dir===2?1.5:0),by+1.8,1.2,0.8,"#7a2c12");
  } else {
    ellipse(c,x-4,y-2-hop*0.3,3,2,"#3f8f3d");ellipse(c,x+4,y-2-hop*0.3,3,2,"#3f8f3d");
    ellipse(c,x,by,10,9,"#6cc36a");ellipse(c,x,by+3,6,4,"#b9eab0");
    // sprout
    const sway=Math.sin(t*2.5)*0.25;
    c.save();c.translate(x,by-8);c.rotate(sway);
    c.fillStyle="#3f8f3d";c.fillRect(-0.8,-6,1.6,6);
    c.fillStyle="#8fdc5a";c.beginPath();c.ellipse(-4,-7,5,2.4,-0.5,0,7);c.fill();c.beginPath();c.ellipse(4,-8,5,2.4,0.5,0,7);c.fill();
    c.restore();
    eyes(c,x,by-1,3.6,dir);
    if(dir===0){ellipse(c,x-6.5,by+1.5,1.8,1.1,"#ff9fb0");ellipse(c,x+6.5,by+1.5,1.8,1.1,"#ff9fb0")}
  }
}
function drawPerson(c,x,y,t,dir,moving,shirt,hair="#2b2622",coat=false){
  const step=moving?Math.sin(t*14):0, bob=moving?Math.abs(step)*1.2:0;
  shadow(c,x,y,8);
  // legs
  c.fillStyle="#3a3f55";c.fillRect(x-4,y-8+(step>0?-1:0),3,7);c.fillRect(x+1,y-8+(step<0?-1:0),3,7);
  // body
  const by=y-8-bob;
  c.fillStyle=coat?"#f2f2ee":shirt;c.beginPath();c.roundRect(x-6,by-11,12,12,3);c.fill();
  if(coat){c.fillStyle=shirt;c.fillRect(x-1,by-11,2,10)}
  // arms
  c.fillStyle=coat?"#e2e2dc":shirt;const sw=moving?step*2:0;
  if(dir!==2)c.fillRect(x-8,by-9+sw,3,8); if(dir!==1)c.fillRect(x+5,by-9-sw,3,8);
  // head
  const hy=by-17;
  ellipse(c,x,hy,7,7,"#f3c9a0");
  c.fillStyle=hair;c.beginPath();
  if(dir===3){c.arc(x,hy,7.3,0,7)}else{c.arc(x,hy-1.5,7.3,Math.PI*1.02,Math.PI*1.98);c.rect(x-7.3,hy-2.5,14.6,2.5)}
  c.fill();
  if(dir===1){c.fillRect(x+2,hy-3,5,6)} if(dir===2){c.fillRect(x-7,hy-3,5,6)}
  eyes(c,x,hy+1,2.6,dir,1.3);
}


/* ---- all species: starters keep their hand-drawn art, others below ---- */
const CANVAS_FILTER=(()=>{try{const c=document.createElement("canvas").getContext("2d");c.filter="hue-rotate(10deg)";return c.filter==="hue-rotate(10deg)"}catch(e){return false}})();
function drawMon(c,kind,x,y,t,dir=0,moving=false,scale=1,shiny=false){
  if(scale!==1){c.save();c.translate(x,y);c.scale(scale,scale);c.translate(-x,-y)}
  if(shiny&&CANVAS_FILTER){c.save();c.filter="hue-rotate(150deg) saturate(1.35) brightness(1.05)"}
  if(kind==="raki"||kind==="puhwa"||kind==="poi")drawStarter(c,kind,x,y,t,dir,moving);
  else drawWild(c,kind,x,y,t,dir,moving);
  if(shiny&&CANVAS_FILTER)c.restore();
  if(shiny){ // 이로치 sparkle
    for(let i=0;i<3;i++){const a=t*2+i*2.1,r=9+Math.sin(t*3+i)*3,sx=x+Math.cos(a)*r,sy=y-12+Math.sin(a)*r*0.8,k=1.6+Math.sin(t*6+i)*0.8;
      c.fillStyle="rgba(255,240,150,.95)";c.beginPath();c.moveTo(sx,sy-k*1.6);c.lineTo(sx+k*0.4,sy-k*0.4);c.lineTo(sx+k*1.6,sy);c.lineTo(sx+k*0.4,sy+k*0.4);c.lineTo(sx,sy+k*1.6);c.lineTo(sx-k*0.4,sy+k*0.4);c.lineTo(sx-k*1.6,sy);c.lineTo(sx-k*0.4,sy-k*0.4);c.closePath();c.fill()}
  }

const enc=new TextEncoder();

function checkBirth(v){

/* =====================================================================
   MULTIPLAYER — one shared map through a free public relay (MQTT over
   secure WebSocket). No host, no direct peer connection: everyone who
   presses "서버 연결" is in the same world and sees each other.
   ===================================================================== */
const RELAYS=["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt","wss://test.mosquitto.org:8081/mqtt"];
const TOPIC="mtw-7c1f2/world1/";               // this game's channel on the relay
const MAX_OTHERS=60;
const NET={mode:"off",status:"",wanted:false,client:null,relay:0,myId:null,joinedAt:0,timer:null,lastBeat:0};

/* ---------- tiny MQTT 3.1.1 client (QoS 0) ---------- */
const te=new TextEncoder(),td=new TextDecoder();
function mqStr(s){const b=te.encode(s);return[b.length>>8,b.length&255,...b]}
function mqLen(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d)}while(n>0);return o}
function mqPacket(head,body){return new Uint8Array([head,...mqLen(body.length),...body])}
class MiniMqtt{
  constructor(url,clientId,will,on){this.url=url;this.id=clientId;this.will=will;this.on=on;this.buf=new Uint8Array(0);this.ready=false;this.pid=1}
  open(){
    let ws;try{ws=new WebSocket(this.url,["mqtt"])}catch(e){setTimeout(()=>this.on.close("open"),0);return}
    this.ws=ws;ws.binaryType="arraybuffer";
    ws.onopen=()=>{
      const flags=0x02|(this.will?0x04:0);
      const vh=[...mqStr("MQTT"),4,flags,0,30];
      const pl=[...mqStr(this.id)];
      if(this.will){pl.push(...mqStr(this.will.topic));const w=te.encode(this.will.msg);pl.push(w.length>>8,w.length&255,...w)}
      ws.send(mqPacket(0x10,[...vh,...pl]));
    };
    ws.onmessage=(e)=>{const d=new Uint8Array(e.data),b=new Uint8Array(this.buf.length+d.length);b.set(this.buf);b.set(d,this.buf.length);this.buf=b;this.parse()};
    ws.onclose=()=>{const was=this.ready;this.ready=false;clearInterval(this.ping);this.on.close(was?"lost":"open")};
    ws.onerror=()=>{};
  }
  parse(){
    for(;;){
      const b=this.buf;if(b.length<2)return;
      let len=0,mul=1,i=1,byte;
      do{if(i>=b.length)return;byte=b[i++];len+=(byte&127)*mul;mul*=128}while(byte&128);
      if(b.length<i+len)return;
      const type=b[0]>>4,body=b.subarray(i,i+len);this.buf=b.slice(i+len);
      if(type===2){ // CONNACK
        if(body[1]!==0){this.ws.close();continue}
        this.ready=true;this.ping=setInterval(()=>this.raw(new Uint8Array([0xC0,0])),20000);this.on.ready();
      } else if(type===3){ // PUBLISH
        const qos=(b[0]>>1)&3,tl=(body[0]<<8)|body[1];let p=2+tl;if(qos>0)p+=2;
        try{this.on.message(td.decode(body.subarray(2,2+tl)),td.decode(body.subarray(p)))}catch(e){}
      }
    }
  }
  raw(u8){if(this.ws&&this.ws.readyState===1)this.ws.send(u8)}
  publish(topic,msg,retain){if(!this.ready)return;this.raw(mqPacket(retain?0x31:0x30,[...mqStr(topic),...te.encode(msg)]))}
  subscribe(filter){const id=this.pid++;this.raw(mqPacket(0x82,[id>>8,id&255,...mqStr(filter),0]))}
  close(){this.ready=false;clearInterval(this.ping);try{this.raw(new Uint8Array([0xE0,0]));this.ws.close()}catch(e){}}
}

/* ---------- connect / reconnect ---------- */
function randomId(){const c="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=randomBytes(12);for(const x of r)s+=c[x%c.length];return s}
function netConnect(){
  if(NET.mode!=="off")return;
  NET.wanted=true;NET.relay=0;NET.tries=0;NET.myId=(S.profile&&S.profile.pid)||NET.myId||randomId();
  openRelay();
}
function openRelay(){
  if(!NET.wanted)return;
  setNetMode("connecting",NET.tries>=RELAYS.length?"중계 서버에 닿지 않아서 계속 다시 시도하고 있어요. 인터넷 연결을 확인해 주세요.":"월드에 들어가는 중이에요…");
  const url=RELAYS[NET.relay];
  const cli=new MiniMqtt(url,"mtw"+NET.myId,{topic:TOPIC+"p/"+NET.myId,msg:'{"bye":1}'},{
    ready(){
      if(NET.client!==cli)return;
      clearTimeout(NET.timer);NET.tries=0;
      cli.subscribe(TOPIC+"p/+");cli.subscribe(TOPIC+"e/"+NET.myId);cli.subscribe(TOPIC+"w");socialSubscribe();
      NET.joinedAt=Date.now();setNetMode("online");
      publishMe();
      setTimeout(()=>{if(NET.mode==="online"&&!S.resume)toast(S.others.size?`월드에 들어왔어요! 나 말고 ${S.others.size}명이 같은 맵에 있어요.`:"월드에 들어왔어요! 아직은 나 혼자예요. 다른 사람이 서버 연결을 누르면 이 맵으로 들어와요.")},3200);
    },
    message:onRelayMsg,
    close(why){
      if(NET.client!==cli)return;
      NET.client=null;clearTimeout(NET.timer);
      if(!NET.wanted)return;
      if(why==="lost"){S.others.clear();renderOnline();toast("연결이 잠깐 끊겼어요. 다시 들어가는 중이에요…")}
      else{NET.tries++;NET.relay=(NET.relay+1)%RELAYS.length}
      NET.timer=setTimeout(openRelay,why==="lost"?500:Math.min(8000,600*NET.tries));
    }
  });
  NET.client=cli;cli.open();
  NET.timer=setTimeout(()=>{if(NET.client===cli&&!cli.ready){try{cli.ws.close()}catch(e){}}},7000); // relay too slow → next one
}
function netDisconnect(){
  NET.wanted=false;clearTimeout(NET.timer);
  const c=NET.client;NET.client=null;
  if(c){if(c.ready)c.publish(TOPIC+"p/"+NET.myId,'{"bye":1}');setTimeout(()=>c.close(),50)}
  S.others.clear();setNetMode("off");toast("혼자 플레이로 돌아왔어요.");
}

/* ---------- messages ---------- */
function myPublic(){const m=S.me,p=S.profile;return{nick:p.nickname,color:p.color,starter:activeSp(),sh:!!(activeMon()&&activeMon().shiny),x:Math.round(m.x),y:Math.round(m.y),d:m.dir,m:m.moving}}
function cleanPlayer(p){
  if(!p||typeof p!=="object")return null;
  const x=Number(p.x),y=Number(p.y);if(!Number.isFinite(x)||!Number.isFinite(y))return null;
  return{nick:String(p.nick||"트레이너").replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,10)||"트레이너",color:COLORS.includes(p.color)?p.color:COLORS[0],
    starter:MONS[p.starter]?p.starter:null,sh:!!p.sh,x:clamp(x,-1e7,1e7),y:clamp(y,-1e7,1e7),d:[0,1,2,3].includes(p.d)?p.d:0,m:!!p.m};
}
function onRelayMsg(topic,text){
  if(topic.startsWith(TOPIC+"p/")){
    const id=topic.slice(TOPIC.length+2);
    if(!/^[a-z0-9]{6,16}$/.test(id)||id===NET.myId)return;
    let m;try{m=JSON.parse(text)}catch(e){return}
    if(m&&m.bye){if(S.others.delete(id))renderOnline();return}
    const p=cleanPlayer(m);if(!p)return;
    let o=S.others.get(id);
    if(!o){
      if(S.others.size>=MAX_OTHERS)return;
      o={x:p.x,y:p.y,cx:p.x,cy:p.y+18,cdir:0};S.others.set(id,o);
      if(Date.now()-NET.joinedAt>3000)toast(`${p.nick} 트레이너가 들어왔어요.`);
      publishMe(); // let the newcomer see me right away
      renderOnline();
    }
    const starterChanged=o.starter!==p.starter;
    Object.assign(o,{tx:p.x,ty:p.y,dir:p.d,moving:p.m,nick:p.nick,color:p.color,starter:p.starter,sh:p.sh,seen:Date.now()});
    if(starterChanged)renderOnline();
  } else if(topic===TOPIC+"w"){
    let m;try{m=JSON.parse(text)}catch(e){return}
    if(m&&typeof m.gone==="string"&&m.gone.length<40)markWildGone(m.gone,m.gone.startsWith("boss_")?BOSS_LIFE*1000:undefined);
    else if(m&&typeof m.back==="string"&&(!S.battle||S.battle.wildId!==m.back))wildGone.delete(m.back);
  } else if(topic===TOPIC+"e/"+NET.myId){
    let m;try{m=JSON.parse(text)}catch(e){return}
    if(m&&m.t==="battle"){const o=S.others.get(String(m.from));toast(`${o?o.nick:"누군가"}님이 배틀을 신청했어요! 배틀 시스템은 다음 단계에서 열려요.`)}
    else if(m&&typeof m.t==="string")onSocialMsg(m);
  } else if(topic.startsWith(TOPIC+"g/")||topic.startsWith(TOPIC+"gc/")){
    let m;try{m=JSON.parse(text)}catch(e){return}
    onGuildTopic(topic,m);
  }
}
function publishMe(){
  if(NET.mode!=="online"||!NET.client)return;
  NET.lastBeat=performance.now();
  NET.client.publish(TOPIC+"p/"+NET.myId,JSON.stringify(myPublic()));
}
let lastSent=0,lastSentKey="";
function netSendMove(force){
  if(NET.mode!=="online")return;
  const now=performance.now(),m=S.me;
  const key=`${Math.round(m.x)},${Math.round(m.y)},${m.dir},${m.moving}`;
  if(!force&&(key===lastSentKey||now-lastSent<90)&&now-NET.lastBeat<2500)return;
  lastSent=now;lastSentKey=key;publishMe();
}
function netSendStarter(){publishMe()}
function netWildGone(id){if(NET.mode==="online"&&NET.client)NET.client.publish(TOPIC+"w",JSON.stringify({gone:id}))}
function netWildBack(id){if(NET.mode==="online"&&NET.client)NET.client.publish(TOPIC+"w",JSON.stringify({back:id}))}
function netBattle(toId){if(NET.mode==="online"&&NET.client)NET.client.publish(TOPIC+"e/"+toId,JSON.stringify({t:"battle",from:NET.myId}))}
/* players who stopped sending (closed tab without goodbye) disappear */
setInterval(()=>{
  if(NET.mode!=="online")return;
  const now=Date.now();let changed=false;
  for(const [id,o] of S.others)if(now-(o.seen||0)>9000){S.others.delete(id);changed=true}
  if(changed)renderOnline();
},2000);

/* ---- full screen (X key) ---- */
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement||S.appFull)}
function toggleFullscreen(){
  // inside the Mac app: ask the app window to go full screen
  try{if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.mtwApp){webkit.messageHandlers.mtwApp.postMessage("toggleFullscreen");S.appFull=!S.appFull;updateFullBtn();return}}catch(e){}
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req){toast("이 기기에서는 전체 화면을 쓸 수 없어요.");return}
  try{const r=req.call(el);if(r&&r.catch)r.catch(()=>toast("이 화면에서는 전체 화면을 쓸 수 없어요."))}catch(e){toast("이 화면에서는 전체 화면을 쓸 수 없어요.")}
}

addEventListener("keydown",e=>{
  if(S.phase!=="game"||e.target.tagName==="INPUT")return;
  const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"," "].includes(k))e.preventDefault();
  if(S.learn)return;
  if(k==="x"){if(!e.repeat)toggleFullscreen();return}
  if(S.battle){if(/^[1-6]$/.test(k)||k===" ")e.preventDefault();if(!e.repeat)battleKey(k);return}
  if(S.mapOpen){if(k==="m"||k==="escape")closeMap();else mapKey(k);return}
  if(k==="b"&&S.modalOpen&&$("bag-list")){closeModal();return}
  if(k==="escape"){e.preventDefault();if(S.modalOpen)closeModal();else if(S.menuOpen)closeMenu();else openMenu();return}
  if(S.modalOpen||S.menuOpen)return;
  if(k==="m"){if(!e.repeat)openMap();return}
  if(k==="b"){if(!e.repeat&&!S.dialog)openBag();return}
  if(k==="o"){if(!e.repeat)toggleSocial();return}
  if(/^[1-6]$/.test(k)){if(!e.repeat&&!S.dialog)switchTo(+k-1);return}
  if(k==="e"||k===" "||k==="enter"){if(!e.repeat)interact();return}
  if(k==="f"){if(!e.repeat)battleRequest();return}
  S.keys.add(k);
});

function nearest(){
  const m=S.me;let best=null,bd=46;
  const d1=Math.hypot(PROF.x-m.x,PROF.y-m.y);if(d1<bd){bd=d1;best={type:"prof"}}
  if(Math.hypot(FOUNTAIN.x-m.x,FOUNTAIN.y-m.y)<66&&S.profile.starter){bd=Math.min(bd,40);best=best||{type:"fountain"}}
  for(const g of GYMS){const d=Math.hypot((g.tx+0.5)*TS-m.x,g.ty*TS+14-m.y);if(d<bd){bd=d;best={type:"gym",gym:g}}}
  const ptx=Math.floor(m.x/TS),pty=Math.floor(m.y/TS),seen=new Set();
  for(let j=-6;j<=2;j+=2)for(let i=-8;i<=8;i+=2){const pl=plotAt(ptx+i,pty+j);if(!pl||seen.has(pl.id))continue;seen.add(pl.id);
    for(const d of plotDoors(pl)){const dd=Math.hypot(d.x-m.x,d.y-m.y);if(dd<bd){bd=dd;best={type:d.kind,x:d.x,y:d.y}}}}
  for(const p of PEDESTALS)if(p.kind!==S.profile.starter){const px=p.tx*TS+16,py=p.ty*TS+26;const d=Math.hypot(px-m.x,py-m.y);if(d<bd){bd=d;best={type:"ped",kind:p.kind}}}
  return best;
}

function interact(){

  const n=nearest();if(!n){cyclePartner();return}
  if(n.type==="fountain"){healAll();toast("분수의 맑은 물로 몬스터들이 모두 회복했어요!");return}
  if(n.type==="heal"){if(!S.profile.party.length){toast("아직 함께하는 몬스터가 없어요.");return}healAll();toast("치유센터에서 몬스터들이 모두 회복했어요!");return}
  if(n.type==="shop"){openShop();return}
  if(n.type==="gym"){
    const g=n.gym,a=activeMon(),have=S.profile.badges.includes(g.id);
    if(!S.profile.starter){toast("먼저 마을의 한결 박사에게 첫 몬스터를 받아 오세요.");return}

    lines.push("자, 승부다!");
    openDialog(`관장 ${g.leader}`,lines,()=>startGymBattle(g));return;
  }

    const p=S.profile;
    if(p.starter){healAll();openDialog(PROF_NAME,["몬스터들을 모두 회복시켜 줬단다.",...TUTORIAL_TIPS,"더 궁금한 게 있으면 언제든 다시 찾아오렴!"])}

      "이 세계에서는 트레이너끼리 서로 싸우지 않아. 마음이 통한 몬스터끼리 실력을 겨루지.",
      "내 앞의 받침대에 세 친구가 있단다. 물속성 라키, 불속성 푸화, 풀속성 포이.",

      "혹시 잘못 골라도 괜찮아. 나중에 다른 받침대 앞에서 E를 누르면 레벨은 그대로 두고 바꿔 줄게."
    ],()=>{S.talked=true;refreshHud()});
  } else if(n.type==="ped")openMonCard(n.kind);

function battleRequest(){
  if(S.phase!=="game"||S.modalOpen||S.menuOpen||S.dialog)return;
  const o=nearestPlayer();if(!o)return;
  if(!activeMon()){toast("배틀하려면 먼저 파트너 몬스터가 있어야 해요.");return}
  const pid=[...S.others.entries()].find(([k,v])=>v===o)?.[0];
  if(pid)netBattle(pid);
  toast(`${o.nick}님에게 배틀을 신청했어요! 배틀 시스템은 다음 단계에서 열려요.`);
}

/* =====================================================================
   PARTY — up to 6 monsters, one summoned (follows you), levels, moves
   ===================================================================== */
const PARTY_MAX=6;
function ensureParty(p){
  if(!Array.isArray(p.party))p.party=[];
  if(!Array.isArray(p.box))p.box=[];
  if(!Array.isArray(p.badges))p.badges=[];
  if(!Number.isFinite(p.gold))p.gold=START_GOLD;
  if(typeof p.pid!=="string"||!/^[a-z0-9]{12}$/.test(p.pid))p.pid=randomId();
  if(!Array.isArray(p.friends))p.friends=[];if(!Array.isArray(p.freqIn))p.freqIn=[];if(!Array.isArray(p.freqOut))p.freqOut=[];
  if(!Array.isArray(p.ginv))p.ginv=[];if(p.guild===undefined)p.guild=null;
  if(!p.bag||typeof p.bag!=="object")p.bag={...START_BAG};
  for(const k in p.bag)if(!ITEMS[k]||!(p.bag[k]>0))delete p.bag[k];
  if(p.starter&&!p.party.length)p.party.push(Object.assign(newMon(p.starter,5),{st:true})); // saves from before levels existed
  if(p.starter&&!p.party.concat(p.box).some(m=>m.st)){const f=p.party.concat(p.box).find(m=>m.sp===p.starter);if(f)f.st=true}
  p.party=p.party.filter(m=>m&&SPECIES[m.sp]);
  for(const m of p.party.concat(p.box)){
    m.lv=clamp(m.lv|0||1,1,MAX_LV);m.xp=Math.max(0,m.xp|0);
    if(!Array.isArray(m.moves)||!m.moves.length)m.moves=movesKnownAt(m.sp,m.lv);
    m.moves=m.moves.filter(id=>MOVES[id]).slice(0,4);
    const mx=monStats(m).hp;if(!Number.isFinite(m.hp))m.hp=mx;m.hp=clamp(m.hp,0,mx);
    if(!m.uid)m.uid=Math.random().toString(36).slice(2,9);
    if(!m.iv){const r=rollIVs(Math.random);m.iv=r.iv;m.special=r.special}
    m.special=!!m.special;m.shiny=!!m.shiny;
  }
  if(!Number.isInteger(p.active)||p.active<0||p.active>=p.party.length)p.active=0;
}
const party=()=>S.profile?S.profile.party:[];
function activeMon(){const p=S.profile;if(!p||!p.party.length)return null;const m=p.party[p.active];return m&&m.hp>0?m:null}
const activeSp=()=>{const m=activeMon();return m?m.sp:null};
const healthy=()=>party().filter(m=>m.hp>0);
function saveProfile(){save({})}

function switchTo(i,quiet){
  const p=S.profile;if(!p||!p.party[i])return;
  const m=p.party[i];
  if(m.hp<=0){if(!quiet)toast(`${SPECIES[m.sp].name}는 기절해서 나올 수 없어요. 마을 분수에서 회복하세요.`);return}
  if(p.active===i){if(!quiet)toast(`${SPECIES[m.sp].name}가 이미 함께하고 있어요.`);return}
  p.active=i;S.comp.x=S.me.x;S.comp.y=S.me.y+4;
  renderParty();netSendStarter();saveProfile();
  if(!quiet)toast(`${SPECIES[m.sp].name}, 나와라!`);
}
function cyclePartner(){
  const p=S.profile;if(!p||!p.party.length){toast("아직 함께하는 몬스터가 없어요.");return}
  if(p.party.length===1){toast(`몬스터가 ${SPECIES[p.party[0].sp].name} 한 마리뿐이에요. 야생 몬스터를 테이밍해 보세요!`);return}
  for(let k=1;k<=p.party.length;k++){const i=(p.active+k)%p.party.length;if(p.party[i].hp>0){switchTo(i);return}}
  toast("나올 수 있는 몬스터가 없어요. 마을 분수에서 회복하세요.");
}
function healAll(){
  for(const m of party().concat(S.profile.box))m.hp=monStats(m).hp;
  const a=S.profile.party[S.profile.active];if(!a||a.hp<=0)S.profile.active=0;
  renderParty();saveProfile();
}
function addMonster(m){
  const p=S.profile;
  if(p.party.length<PARTY_MAX){p.party.push(m);renderParty();saveProfile();return "party"}
  p.box.push(m);saveProfile();return "box";
}

/* ---- experience & levels ---- */
async function gainXp(m,amount,say){
  if(m.lv>=MAX_LV)return;
  m.xp+=amount;
  await say(`${SPECIES[m.sp].name}가 경험치 ${amount}을 얻었어요.`);
  while(m.lv<MAX_LV&&m.xp>=xpNeed(m.lv)){
    m.xp-=xpNeed(m.lv);
    const before=monStats(m);m.lv++;const after=monStats(m);
    m.hp=Math.min(after.hp,m.hp+(after.hp-before.hp));
    await say(`${SPECIES[m.sp].name}의 레벨이 ${m.lv}이 되었어요!`);
    for(const [lv,id] of SPECIES[m.sp].learn)if(lv===m.lv)await learnMove(m,id,say);
  }
  if(m.lv>=MAX_LV)m.xp=0;
  renderParty();
}
/* learn a move; with 4 already, the player picks one to forget or skips */
function learnMove(m,id,say){
  if(m.moves.includes(id))return Promise.resolve();
  const mv=MOVES[id],name=SPECIES[m.sp].name;
  if(m.moves.length<4){m.moves.push(id);return say(`${name}가 ${mv.n}${mv.sp?` (${mv.sp} 기술)`:""}을(를) 배웠어요!`)}
  return new Promise(res=>{
    S.learn={m,id};
    $("learn-title").textContent=`${name}가 ${mv.sp?mv.sp+" 기술 ":"새 기술 "}「${mv.n}」을 배우려고 해요`;
    $("learn-sub").textContent=`기술은 4개까지만 알 수 있어요. 잊을 기술을 고르거나, 이번에는 배우지 않을 수 있어요.`;
    const list=$("learn-list");list.textContent="";
    const row=(mid,isNew)=>{const b=document.createElement("button");b.type="button";b.className="mv"+(isNew?" new":"");
      const M=MOVES[mid],l=document.createElement("span");l.textContent=M.n;
      const tag=document.createElement("span");tag.className="tag";tag.style.background=TYPES[M.t].color;tag.textContent=TYPES[M.t].name;l.appendChild(tag);
      const r=document.createElement("small");r.textContent=moveDesc(M);b.append(l,r);return b};
    const head=row(id,true);head.disabled=true;head.style.cursor="default";head.querySelector("small").textContent="새 기술 · "+moveDesc(mv);list.appendChild(head);
    const done=(text)=>{$("learn").hidden=true;S.learn=null;renderParty();saveProfile();say(text).then(res)};
    m.moves.forEach((mid,i)=>{const b=row(mid,false);b.querySelector("small").textContent=moveDesc(MOVES[mid])+" · 잊기";
      b.onclick=()=>{const old=MOVES[mid].n;m.moves[i]=id;done(`${name}가 ${old}을(를) 잊고 ${mv.n}을(를) 배웠어요!`)};list.appendChild(b)});
    const skip=document.createElement("button");skip.type="button";skip.className="btn ghost";skip.textContent="배우지 않기";

  if(!forced){const back=document.createElement("button");back.type="button";back.textContent="취소";back.onclick=()=>{box.hidden=true;$("bmoves").hidden=false};box.appendChild(back)}
  $("bmoves").hidden=true;box.hidden=false;
}
function battleKey(k){
  const b=S.battle;if(!b||S.learn)return;
  if(sayResolve&&(k==="enter"||k===" "||k==="e")){skipSay();return}
  if(!$("bswitch").hidden){if(k==="escape"&&!b.forced){$("bswitch").hidden=true;$("bmoves").hidden=false}else if(/^[1-6]$/.test(k)){const btn=$("bswitch").children[+k-1];if(btn&&!btn.disabled)btn.click()}return}
  if(b.busy)return;
  if(/^[1-4]$/.test(k)&&myMon().moves[+k-1])playerTurn({move:+k-1});
  else if(k==="t"&&b.kind==="wild")chooseBall();
  else if(k==="b")chooseItem();
  else if(k==="r"&&b.kind==="wild")playerTurn({run:true});

/* ---- AI ---- */
function foeChoose(foe,me){
  const st=monStats(foe);let best=null,bv=-1;
  for(const id of foe.moves){const M=MOVES[id];let v;
    if(M.kind==="heal")v=foe.hp/st.hp<.35?120:5;
    else if(M.kind)v=S.battle.op[M.stat]<1?28:3;
    else v=M.p*(M.a/100)*effOf(M.t,SPECIES[me.sp].type)*(M.t===SPECIES[foe.sp].type?1.5:1);
    v*=0.75+Math.random()*0.5;if(v>bv){bv=v;best=id}}
  return best;
}

/* ---- one round ---- */
async function playerTurn(act){
  const b=S.battle;if(!b||b.busy)return;
  b.busy=true;renderBattleUI();
  const me=myMon(),foe=foeMon();
  if(act.run){
    const ms=monStats(me).spe*stageMul(b.my.spe),fs=monStats(foe).spe*stageMul(b.op.spe);
    if(Math.random()<Math.min(.95,.45+.35*ms/fs)){await bsay("무사히 도망쳤어요!");wildGone.delete(b.wildId);netWildBack(b.wildId);S.encounterCool=Date.now()+4000;return endBattle()}
    await bsay("도망칠 수 없었어요!");
    await foeAct(foe,me);return afterRound();
  }
  if(act.item){
    const msg=usePotionOn(act.item,me);await bsay(msg||"약을 쓸 수 없었어요.");
    await foeAct(foe,me);return afterRound();
  }
  if(act.tame){
    bagAdd(act.tame,-1);saveProfile();
    await bsay(`${ITEMS[act.tame].n}을(를) 던졌어요!`,800);
    const fst=monStats(foe),base=(1-0.7*foe.hp/fst.hp)*clamp(1.15-(foe.lv-me.lv)*0.04,0.25,1.3)*0.6+0.05;
    const chance=clamp(base*ITEMS[act.tame].rate*(b.boss?0.45:1),0.02,0.95);
    b.anim={who:"tame",t:performance.now()};
    for(let i=0;i<3;i++){await sleep(420);if(Math.random()>Math.pow(chance,1/3)){b.anim=null;await bsay(`${SPECIES[foe.sp].name}가 마음을 열지 않았어요!`);await foeAct(foe,me);return afterRound()}}
    b.anim=null;
    const where=addMonster(foe);
    markWildGone(b.wildId,b.boss?BOSS_LIFE*1000:undefined);netWildGone(b.wildId);
    await bsay(`야호! ${b.boss?"보스 ":""}${SPECIES[foe.sp].name}(Lv${foe.lv})를 테이밍했어요!`,1300);
    if(where==="box")await bsay(`팀이 가득 차서 ${SPECIES[foe.sp].name}는 보관함으로 갔어요.`,1200);
    else await bsay(`${SPECIES[foe.sp].name}가 팀에 들어왔어요. E나 숫자 키로 교체할 수 있어요.`,1300);
    return endBattle();
  }
  if(act.switchTo!=null){
    S.profile.active=act.switchTo;b.my={atk:0,def:0,spa:0,sdf:0,spe:0,eva:0};
    await bsay(`${SPECIES[me.sp].name}, 돌아와! ${SPECIES[myMon().sp].name}, 부탁해!`,1000);
    await foeAct(foe,myMon());return afterRound();
  }
  // both attack, faster first
  const myMv=me.moves[act.move],foeMv=foeChoose(foe,me);
  const mp=MOVES[myMv].prio||0,fp=MOVES[foeMv].prio||0;
  const ms=monStats(me).spe*stageMul(b.my.spe),fs=monStats(foe).spe*stageMul(b.op.spe);
  const meFirst=mp!==fp?mp>fp:ms!==fs?ms>fs:Math.random()<.5;
  if(meFirst){await doMove(me,foe,myMv,"my");if(foe.hp>0&&me.hp>0)await doMove(foe,me,foeMv,"op")}
  else{await doMove(foe,me,foeMv,"op");if(me.hp>0&&foe.hp>0)await doMove(me,foe,myMv,"my")}
  return afterRound();
}
async function foeAct(foe,me){if(foe.hp>0&&me.hp>0)await doMove(foe,me,foeChoose(foe,me),"op")}

async function doMove(att,def,id,side){
  const b=S.battle,M=MOVES[id],mine=side==="my",aSt=mine?b.my:b.op,dSt=mine?b.op:b.my;
  const who=mine?SPECIES[att.sp].name:(b.kind==="wild"?"야생 ":"상대 ")+SPECIES[att.sp].name;
  await bsay(`${who}의 ${M.n}!`,700);
  if(M.kind==="heal"){const mx=monStats(att).hp,h=Math.max(1,Math.round(mx*M.frac));att.hp=Math.min(mx,att.hp+h);renderParty();return bsay(`${who}의 체력이 회복되었어요.`,800)}
  if(M.kind==="buff"){aSt[M.stat]=Math.min(3,aSt[M.stat]+M.st);if(M.also)aSt[M.also[0]]=Math.min(3,aSt[M.also[0]]+M.also[1]);return bsay(`${who}의 ${STAT_KO[M.stat]}${M.also?"과 "+STAT_KO[M.also[0]]:""}이(가) 올라갔어요!`,850)}
  if(M.kind==="debuff"){dSt[M.stat]=Math.max(-3,dSt[M.stat]-M.st);return bsay(`상대의 ${STAT_KO[M.stat]}이(가) 떨어졌어요!`,850)}
  if(Math.random()*100>=M.a/stageMul(dSt.eva))return bsay("하지만 빗나갔어요!",800);
  if(Math.random()*100<monStats(def).eva)return bsay(`${mine?"상대":SPECIES[def.sp].name}가 날렵하게 피했어요!`,800);
  const sp=moveCat(id)==="s",A=monStats(att)[sp?"spa":"atk"]*stageMul(aSt[sp?"spa":"atk"]),D=monStats(def)[sp?"sdf":"def"]*stageMul(dSt[sp?"sdf":"def"]);
  const eff=effOf(M.t,SPECIES[def.sp].type),stab=M.t===SPECIES[att.sp].type?1.5:1,crit=Math.random()<1/16?1.5:1;
  let dmg=Math.floor(Math.floor((2*att.lv/5+2)*M.p*A/D)/50)+2;
  dmg=Math.max(1,Math.floor(dmg*stab*eff*crit*(0.85+Math.random()*0.15)));
  def.hp=Math.max(0,def.hp-dmg);b.anim={who:mine?"op":"my",t:performance.now()};
  renderParty();
  if(crit>1)await bsay("급소에 맞았어요!",650);
  if(eff>1)await bsay("효과가 굉장했어요!",750);else if(eff<1)await bsay("효과가 별로인 것 같아요…",750);
  if(M.lower&&def.hp>0){dSt[M.lower[0]]=Math.max(-3,dSt[M.lower[0]]-M.lower[1]);await bsay(`상대의 ${STAT_KO[M.lower[0]]}이(가) 떨어졌어요!`,700)}
}

/* =====================================================================
   WORLD MAP (M) — drawn in blocks on demand, so it covers an endless world
   ===================================================================== */
const MAPB=96, MAPSTEP=3;               // tiles per block, tiles per map pixel
const mapBlocks=new Map();
const BIOME_KO={meadow:"들판",grass:"풀숲",bug:"벌레 숲",fire:"화산",water:"호수",dragon:"드래곤 산",fighting:"격투 고원"};
const WM={cx:TOWN.cx,cy:TOWN.cy,scale:1.2,drag:null};
function mapColor(tx,ty){
  const t=baseTile(tx,ty),b=biomeAt(tx,ty),P=PAL[b]||PAL.meadow;
  switch(t){
    case T.WATER:return"#3f8fd6";case T.LAVA:return"#c8401e";case T.TREE:return P.tree[0];case T.ROCK:return b==="fire"?"#3e3530":"#7d7a76";
    case T.CRYSTAL:return"#8a6be0";case T.PATH:case T.BRIDGE:return"#e3c48c";case T.PLAZA:case T.FOUNTAIN:case T.PEDESTAL:return"#d8d2c4";
    case T.HOUSE:return"#c4523f";case T.GYM:case T.GYMFLOOR:{const g=gymZone(tx,ty);return g?g.color:"#ccc"}
    case T.HEAL:return"#ff6f9a";case T.SHOP:return"#4f8fff";
    case T.TALL:return P.tall;default:return P.g;
  }
}
function mapBlock(bx,by){
  const key=bx+","+by;let cv=mapBlocks.get(key);if(cv)return cv;
  const n=MAPB/MAPSTEP;cv=document.createElement("canvas");cv.width=cv.height=n;
  const c=cv.getContext("2d"),img=c.createImageData(n,n);
  for(let j=0;j<n;j++)for(let i=0;i<n;i++){
    const col=mapColor(bx*MAPB+i*MAPSTEP+1,by*MAPB+j*MAPSTEP+1),o=(j*n+i)*4;
    img.data[o]=parseInt(col.slice(1,3),16);img.data[o+1]=parseInt(col.slice(3,5),16);img.data[o+2]=parseInt(col.slice(5,7),16);img.data[o+3]=255;
  }
  c.putImageData(img,0,0);mapBlocks.set(key,cv);return cv;
}

const wmc=$("wmc"),wctx=wmc.getContext("2d");

function mapKey(k){if(k==="+"||k==="=")mapZoom(1.25);else if(k==="-"||k==="_")mapZoom(0.8);else if(k==="0"){WM.cx=S.me.x/TS;WM.cy=S.me.y/TS}}
function renderMap(){
  const r=wmc.getBoundingClientRect(),w=r.width,h=r.height;
  if(wmc.width!==Math.round(w*DPR)||wmc.height!==Math.round(h*DPR)){wmc.width=Math.round(w*DPR);wmc.height=Math.round(h*DPR)}
  const c=wctx,s=WM.scale;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle="#0b1216";c.fillRect(0,0,w,h);
  const tx0=WM.cx-w/2/s,ty0=WM.cy-h/2/s,tx1=WM.cx+w/2/s,ty1=WM.cy+h/2/s;
  c.imageSmoothingEnabled=s<MAPSTEP;
  let budget=5; // new blocks per frame, so opening the map never freezes
  for(let by=Math.floor(ty0/MAPB);by<=Math.floor(ty1/MAPB);by++)for(let bx=Math.floor(tx0/MAPB);bx<=Math.floor(tx1/MAPB);bx++){
    const key=bx+","+by;let cv=mapBlocks.get(key);
    if(!cv){if(budget--<=0)continue;cv=mapBlock(bx,by)}
    c.drawImage(cv,(bx*MAPB-tx0)*s,(by*MAPB-ty0)*s,MAPB*s+0.5,MAPB*s+0.5);
  }
  const P=(tx,ty)=>[(tx-tx0)*s,(ty-ty0)*s];
  // level guide rings around town
  c.lineWidth=1;c.font="12px Jua, sans-serif";c.textAlign="center";c.textBaseline="middle";
  for(let L=10;L<=90;L+=10){const rr=(L-2)*7.5*s,[ox,oy]=P(TOWN.cx,TOWN.cy);c.strokeStyle="rgba(255,255,255,.18)";c.setLineDash([4,6]);c.beginPath();c.arc(ox,oy,rr,0,7);c.stroke();c.setLineDash([]);
    if(rr>30){c.fillStyle="rgba(255,255,255,.55)";c.fillText(`야생 Lv${L}`,ox,oy-rr-8)}}
  // town
  {const [x,y]=P(TOWN.cx,TOWN.cy);c.fillStyle="#fff";c.beginPath();c.arc(x,y,7,0,7);c.fill();c.fillStyle="#c4523f";c.beginPath();c.arc(x,y,4.5,0,7);c.fill();

   else{c.textAlign="right";c.fillStyle="rgba(255,179,163,.9)";c.font="13px Jua, sans-serif";c.fillText(`다음 보스까지 ${mmss(nextBossAt()-Date.now())}`,w-12,h-14)}}

function tag(c,text,x,y,col){

}

/* =====================================================================
   LIVE UPDATE — when a new version is published at the game's address,
   swap to it in about a second, keeping login, position and connection.
   ===================================================================== */
const GAME_VERSION="0.7.0";
const UPDATE_CHECK_MS=15000;
let pendingUpdate=null;
async function checkForUpdate(){
  if(!/^https?:$/.test(location.protocol)||pendingUpdate)return; // a downloaded file can't update itself
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const v=await r.json();
    if(v&&typeof v.version==="string"&&v.version!==GAME_VERSION)pendingUpdate=v.version;
  }catch(e){}
}
function updateBlocked(){
  if(S.phase==="game")return S.modalOpen||!!S.dialog||!!S.battle||!!S.learn; // let the player finish reading / choosing first
  return [...document.querySelectorAll("#auth input")].some(i=>i.value&&i.type!=="checkbox"); // don't wipe a half-filled form
}
function applyUpdate(){
  if(!pendingUpdate||NET.updating||updateBlocked())return;
  NET.updating=true;
  const resume={v:pendingUpdate,at:Date.now(),phase:S.phase};
  if(S.phase==="game"){
    Object.assign(resume,{x:Math.round(S.me.x),y:Math.round(S.me.y),dir:S.me.dir,cx:Math.round(S.comp.x),cy:Math.round(S.comp.y),talked:S.talked,net:NET.wanted,myId:NET.myId});
    if(S.profile.starter){S.profile.x=resume.x;S.profile.y=resume.y}
    try{localStorage.setItem(LS_KEY,JSON.stringify(S.profile))}catch(e){}
  }
  try{sessionStorage.setItem("mtw-resume",JSON.stringify(resume))}catch(e){}
  // leave the relay quietly: others keep seeing me until I'm back a moment later
  NET.wanted=false;clearTimeout(NET.timer);if(NET.client)NET.client.close();
  const u=new URL(location.href);u.searchParams.set("v",pendingUpdate);u.hash="";
  location.replace(u.toString());
}
setInterval(checkForUpdate,UPDATE_CHECK_MS);setTimeout(checkForUpdate,3000);

function update(dt){
  S.t+=dt;
  if(pendingUpdate)applyUpdate();
  if(S.phase!=="game")return;
  const m=S.me;let vx=0,vy=0;
  if(!S.dialog&&!S.modalOpen&&!S.menuOpen&&!S.battle&&!S.mapOpen&&!S.learn){
    const k=S.keys;
    if(k.has("a")||k.has("arrowleft"))vx-=1;if(k.has("d")||k.has("arrowright"))vx+=1;
    if(k.has("w")||k.has("arrowup"))vy-=1;if(k.has("s")||k.has("arrowdown"))vy+=1;
    if(S.joy.active&&Math.hypot(S.joy.x,S.joy.y)>0.2){vx=S.joy.x;vy=S.joy.y}
  }
  const len=Math.hypot(vx,vy);
  m.moving=len>0.1;
  if(m.moving){
    const sp=150*Math.min(1,len)/len; vx*=sp;vy*=sp;
    if(Math.abs(vx)>Math.abs(vy))m.dir=vx<0?1:2;else m.dir=vy<0?3:0;
    const nx=m.x+vx*dt,ny=m.y+vy*dt;
    if(!blocked(nx,m.y))m.x=nx; if(!blocked(m.x,ny))m.y=ny;
    S.movedSinceSave=true;
  } else if(S.movedSinceSave&&performance.now()-S.lastSave>5000&&S.profile.starter){
    S.lastSave=performance.now();S.movedSinceSave=false;save({x:Math.round(m.x),y:Math.round(m.y)});
  }
  follow(S.comp,m,dt);
  // walking into a wild monster starts a battle
  if(!S.battle&&!S.dialog&&!S.modalOpen&&!S.menuOpen&&!S.mapOpen&&!S.learn&&Date.now()>S.encounterCool&&activeMon()){
    for(const w of wildNear(m.x,m.y,1))if(Math.hypot(w.x-m.x,w.y-m.y)<(w.boss?30:20)){startWildBattle(w);break}
  }
  if((S.t%1)<dt)bossWatch();
  if((S.t%1)<dt)refreshQuest();
  for(const o of S.others.values()){
    const k=Math.min(1,dt*10);o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;
    const c={x:o.cx,y:o.cy,dir:o.cdir};follow(c,o,dt);o.cx=c.x;o.cy=c.y;o.cdir=c.dir;o.cmov=c.moving;
  }
  netSendMove(false);
  // contextual buttons
  if(isTouch){
    const n=nearest(),p=nearestPlayer();
    const be=$("btn-e");be.classList.toggle("hot",!!n||!!S.dialog);
    be.innerHTML=S.dialog?"E<br>계속":!n?"E<br>교체":n.type==="prof"?"E<br>말 걸기":n.type==="gym"?"E<br>도전":n.type==="fountain"||n.type==="heal"?"E<br>회복":n.type==="shop"?"E<br>상점":"E<br>살펴보기";
    $("btn-f").hidden=!p;
  }
}
function follow(c,lead,dt){
  const back=[[0,-1],[1,0],[-1,0],[0,1]][lead.dir]; // behind the leader
  const tx=lead.x+back[0]*22,ty=lead.y+back[1]*20+(lead.dir===0?-2:0);
  const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy);
  c.moving=d>3;
  if(d>2){const k=Math.min(1,dt*6);c.x+=dx*k;c.y+=dy*k;
    if(Math.abs(dx)>Math.abs(dy))c.dir=dx<0?1:2;else c.dir=dy<0?3:0}
  else c.dir=lead.dir;
  if(d>200){c.x=tx;c.y=ty}
}

function bossWatch(){
  const b=currentBoss();
  if(b&&S.lastBossAnn!==b.id&&S.profile&&S.profile.starter){S.lastBossAnn=b.id;
    const dx=b.tx-S.me.x/TS,dy=b.ty-S.me.y/TS;
    toast(`👑 보스 ${b.shiny?"✨이로치 ":""}${SPECIES[b.sp].name}(Lv${b.lv}) 등장! ${dirWord(dx,dy)}쪽 ${Math.round(Math.hypot(dx,dy))}칸 · ${mmss(b.endsAt-Date.now())} 남음 · M 지도 확인`)}
}
function refreshQuest(){if(S.profile&&S.profile.starter&&!$("quest").hidden)$("quest-text").textContent=nextGoalText()}

/* =====================================================================
   FRIENDS & GUILD — no central server: each player keeps their own lists,
   requests travel through the relay to players who are online right now.
   A guild's member list lives on the relay as a retained message the
   leader keeps up to date.
   ===================================================================== */
const SOC={open:false,tab:"friends",chat:[],roster:null};
const fmtCode=(pid)=>pid.replace(/(.{4})(.{4})(.{4})/,"$1-$2-$3");
const parseCode=(s)=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const isFriend=(pid)=>S.profile.friends.some(f=>f.pid===pid);
const onlineNick=(pid)=>{const o=S.others.get(pid);return o?o.nick:null};
function sendTo(pid,msg){
  if(NET.mode!=="online"||!NET.client)return false;
  NET.client.publish(TOPIC+"e/"+pid,JSON.stringify({...msg,from:NET.myId,nick:S.profile.nickname}));return true;
}
function needOnline(){if(NET.mode!=="online"){toast("먼저 ESC → 서버 연결을 눌러 온라인으로 들어가 주세요.");return true}return false}
const cleanNick=(n)=>String(n||"트레이너").replace(/[^가-힣A-Za-z0-9]/g,"").slice(0,10)||"트레이너";
const cleanGName=(n)=>String(n||"").replace(/[^가-힣A-Za-z0-9 ]/g,"").trim().slice(0,12);

/* ---- friends ---- */
function friendRequest(pid){
  if(needOnline())return;
  pid=parseCode(pid);
  if(!/^[a-z0-9]{12}$/.test(pid)){toast("친구 코드는 12자리예요. (예: abcd-efgh-ijkl)");return}
  if(pid===S.profile.pid){toast("내 코드는 신청할 수 없어요.");return}
  if(isFriend(pid)){toast("이미 친구예요.");return}
  if(!S.others.has(pid)){toast("그 트레이너는 지금 접속 중이 아니에요. 접속해 있을 때 다시 신청해 주세요.");return}
  if(S.profile.freqIn.some(r=>r.pid===pid)){acceptFriend(pid);return}
  sendTo(pid,{t:"freq"});
  if(!S.profile.freqOut.includes(pid))S.profile.freqOut.push(pid);
  saveProfile();toast(`${onlineNick(pid)}님에게 친구 신청을 보냈어요.`);renderSocial();
}
function acceptFriend(pid){
  const r=S.profile.freqIn.find(x=>x.pid===pid);if(!r)return;
  S.profile.freqIn=S.profile.freqIn.filter(x=>x.pid!==pid);
  if(!isFriend(pid))S.profile.friends.push({pid,nick:r.nick,since:Date.now()});
  sendTo(pid,{t:"facc"});saveProfile();toast(`${r.nick}님과 친구가 되었어요!`);renderSocial();
}
function declineFriend(pid){S.profile.freqIn=S.profile.freqIn.filter(x=>x.pid!==pid);sendTo(pid,{t:"fdec"});saveProfile();renderSocial()}
function removeFriend(pid){S.profile.friends=S.profile.friends.filter(f=>f.pid!==pid);sendTo(pid,{t:"frem"});saveProfile();renderSocial()}

/* ---- guild ---- */
const G=()=>S.profile.guild;
const amLeader=()=>G()&&G().leader===S.profile.pid;
function publishRoster(){
  const g=G();if(!g||!amLeader()||NET.mode!=="online")return;
  g.ver=(g.ver|0)+1;
  NET.client.publish(TOPIC+"g/"+g.id,JSON.stringify({gid:g.id,name:g.name,leader:g.leader,members:g.members,ver:g.ver}),true);
}
function socialSubscribe(){const g=G();if(g&&NET.client){NET.client.subscribe(TOPIC+"g/"+g.id);NET.client.subscribe(TOPIC+"gc/"+g.id);if(amLeader())setTimeout(publishRoster,800)}}
function createGuild(name){
  name=cleanGName(name);
  if(name.length<2){toast("길드 이름은 2~12자의 한글·영문·숫자로 정해 주세요.");return}
  if(G()){toast("이미 길드에 들어가 있어요.");return}
  const id=randomId();
  S.profile.guild={id,name,leader:S.profile.pid,members:{[S.profile.pid]:S.profile.nickname},ver:0,created:Date.now()};
  saveProfile();socialSubscribe();publishRoster();toast(`길드 「${name}」를 만들었어요! 접속 중인 트레이너를 초대해 보세요.`);renderSocial();
}
function inviteGuild(pid){
  if(needOnline())return;const g=G();
  if(!g||!amLeader()){toast("길드장만 초대할 수 있어요.");return}
  if(g.members[pid]){toast("이미 길드원이에요.");return}
  if(Object.keys(g.members).length>=30){toast("길드원은 30명까지예요.");return}
  sendTo(pid,{t:"ginv",gid:g.id,name:g.name,leader:g.leader});toast(`${onlineNick(pid)||"트레이너"}님에게 길드 초대를 보냈어요.`);
}
function acceptGuild(gid){
  const inv=S.profile.ginv.find(x=>x.gid===gid);if(!inv)return;
  if(G()){toast("지금 길드를 먼저 나가야 다른 길드에 들어갈 수 있어요.");return}
  if(needOnline())return;
  if(!S.others.has(inv.leader)){toast("길드장이 접속해 있을 때 가입할 수 있어요.");return}
  sendTo(inv.leader,{t:"gjoin",gid});S.profile.ginv=S.profile.ginv.filter(x=>x.gid!==gid);saveProfile();
  toast("가입 신청을 보냈어요. 길드장이 확인하면 바로 들어가요.");renderSocial();
}
function leaveGuild(){
  const g=G();if(!g)return;
  if(amLeader()){ // disband
    if(NET.mode==="online"){NET.client.publish(TOPIC+"g/"+g.id,JSON.stringify({gid:g.id,disband:true}),true)}
    toast(`길드 「${g.name}」를 해체했어요.`);
  } else {sendTo(g.leader,{t:"gleave",gid:g.id});toast(`길드 「${g.name}」에서 나왔어요.`)}
  S.profile.guild=null;SOC.chat=[];saveProfile();renderSocial();
}
function guildChat(text){
  const g=G();text=String(text||"").replace(/[\u0000-\u001f]/g,"").trim().slice(0,120);if(!g||!text)return;
  if(needOnline())return;
  NET.client.publish(TOPIC+"gc/"+g.id,JSON.stringify({from:NET.myId,nick:S.profile.nickname,text,at:Date.now()}));
}
function onGuildTopic(topic,m){
  const g=G();if(!g||!m)return;
  if(topic===TOPIC+"gc/"+g.id){
    if(typeof m.text!=="string")return;
    SOC.chat.push({nick:cleanNick(m.nick),text:m.text.slice(0,120),me:m.from===NET.myId,at:Date.now()});SOC.chat=SOC.chat.slice(-60);
    if(!m.from||m.from!==NET.myId){if(!SOC.open||SOC.tab!=="guild")toast(`[길드] ${cleanNick(m.nick)}: ${m.text.slice(0,40)}`)}
    renderSocial();return;
  }
  if(topic===TOPIC+"g/"+g.id){
    if(m.disband){if(!amLeader()){toast(`길드 「${g.name}」가 해체되었어요.`);S.profile.guild=null;saveProfile();renderSocial()}return}
    if(m.leader!==g.leader||typeof m.members!=="object")return; // only the leader's roster counts
    if(amLeader())return;
    if(!m.members[S.profile.pid]){toast(`길드 「${g.name}」에서 빠지게 되었어요.`);S.profile.guild=null;saveProfile();renderSocial();return}
    const mem={};for(const [k,v] of Object.entries(m.members).slice(0,30))if(/^[a-z0-9]{12}$/.test(k))mem[k]=cleanNick(v);
    g.members=mem;g.name=cleanGName(m.name)||g.name;saveProfile();renderSocial();
  }
}
function onSocialMsg(m){
  const from=String(m.from||""),nick=cleanNick(m.nick);
  if(!/^[a-z0-9]{12}$/.test(from))return;
  const p=S.profile;
  switch(m.t){
    case"freq":if(isFriend(from))return sendTo(from,{t:"facc"});
      if(p.freqOut.includes(from)){p.freqOut=p.freqOut.filter(x=>x!==from);p.friends.push({pid:from,nick,since:Date.now()});sendTo(from,{t:"facc"});toast(`${nick}님과 친구가 되었어요!`);break}
      if(!p.freqIn.some(r=>r.pid===from)){p.freqIn.push({pid:from,nick,at:Date.now()});p.freqIn=p.freqIn.slice(-30)}
      toast(`${nick}님이 친구 신청을 보냈어요. 오른쪽 위 [친구]에서 확인하세요.`);break;
    case"facc":if(!p.freqOut.includes(from)&&!isFriend(from))return;
      p.freqOut=p.freqOut.filter(x=>x!==from);if(!isFriend(from))p.friends.push({pid:from,nick,since:Date.now()});toast(`${nick}님이 친구 신청을 수락했어요!`);break;
    case"fdec":p.freqOut=p.freqOut.filter(x=>x!==from);break;
    case"frem":p.friends=p.friends.filter(f=>f.pid!==from);break;
    case"ginv":{const gid=String(m.gid||""),name=cleanGName(m.name),leader=String(m.leader||"");
      if(!/^[a-z0-9]{12}$/.test(gid)||!name||leader!==from)return;
      if(!p.ginv.some(x=>x.gid===gid)){p.ginv.push({gid,name,leader,from:nick,at:Date.now()});p.ginv=p.ginv.slice(-10)}
      toast(`${nick}님이 길드 「${name}」에 초대했어요. [친구] 창의 신청 탭에서 확인하세요.`);break}
    case"gjoin":{const g=G();if(!g||!amLeader()||m.gid!==g.id)return;
      if(Object.keys(g.members).length>=30)return;
      g.members[from]=nick;publishRoster();
      sendTo(from,{t:"gwelcome",gid:g.id,name:g.name,leader:g.leader,members:g.members});toast(`${nick}님이 길드에 들어왔어요!`);break}
    case"gwelcome":{if(G())return;const gid=String(m.gid||"");if(!/^[a-z0-9]{12}$/.test(gid)||m.leader!==from)return;
      const mem={};for(const [k,v] of Object.entries(m.members||{}).slice(0,30))if(/^[a-z0-9]{12}$/.test(k))mem[k]=cleanNick(v);
      p.guild={id:gid,name:cleanGName(m.name)||"길드",leader:from,members:mem,ver:0};socialSubscribe();toast(`길드 「${p.guild.name}」에 들어왔어요!`);break}
    case"gleave":{const g=G();if(!g||!amLeader()||m.gid!==g.id||!g.members[from])return;delete g.members[from];publishRoster();toast(`${nick}님이 길드를 나갔어요.`);break}
    default:return;
  }
  saveProfile();renderSocial();
}

/* ---- panel ---- */
function toggleSocial(force){
  if(S.phase!=="game")return;
  SOC.open=force!=null?force:!SOC.open;$("social").hidden=!SOC.open;placeSocial();renderSocial();
}
function placeSocial(){

  const top=$("online").getBoundingClientRect().bottom+8;pn.style.top=top+"px";pn.style.maxHeight=Math.max(240,innerHeight-top-150)+"px";

addEventListener("resize",placeSocial);
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(k==="on")e.onclick=v;else if(k==="cls")e.className=v;else e.setAttribute(k,v)}for(const c of kids)e.append(c);return e}
function renderSocial(){
