name: Build GrowAI APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/growai.keystore
          else
            echo "::warning::KEYSTORE_B64 secret 없음 → 임시 키로 서명 (업데이트 시 재설치 필요)"
            keytool -genkeypair -keystore app/growai.keystore -storepass growai123 -keypass growai123 -alias growai -keyalg RSA -keysize 2048 -validity 36500 -dname CN=GrowAI
          fi

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk GrowAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GrowAI-apk
          path: GrowAI.apk

      # 폰에서 바로 받을 수 있게 Releases에 "latest"로 올림
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GrowAI 최신 APK
          body: "커밋 ${{ github.sha }} 에서 자동 빌드됨. GrowAI.apk 를 폰에서 눌러 설치하세요."
          files: GrowAI.apk
          make_latest: true
